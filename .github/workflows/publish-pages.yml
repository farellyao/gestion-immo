name: Publish verification page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.external=False; self.parts=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.inside=True; self.external=any(k=='src' for k,v in attrs); self.current=[]
              def handle_data(self, data):
                  if self.inside and not self.external: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.inside:
                      if not self.external: self.parts.append(''.join(self.current))
                      self.inside=False; self.external=False
          for filename in ('app.html', 'index.html'):
              p=Scripts(); p.feed(Path(filename).read_text(encoding='utf-8'))
              Path('/tmp/'+filename+'.js').write_text('\\n'.join(p.parts), encoding='utf-8')
          PY
          node --check /tmp/app.html.js
          node --check /tmp/index.html.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
