name: Publish verification page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.external=False; self.parts=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.inside=True; self.external=any(k=='src' for k,v in attrs); self.current=[]
              def handle_data(self, data):
                  if self.inside and not self.external: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.inside:
                      if not self.external: self.parts.append(''.join(self.current))
                      self.inside=False; self.external=False
          for filename in ('app.html', 'index.html'):
              source = Path(filename).read_text(encoding='utf-8')
              import re
              lower = source.lower().rstrip()
              if not lower.endswith('</html>') or '</body>' not in lower or '</head>' not in lower:
                  raise SystemExit(f'{filename}: document HTML incomplet (balises de fermeture manquantes)')
              script_open = len(re.findall(r'<script\b', source, flags=re.I))
              script_close = len(re.findall(r'</script\s*>', source, flags=re.I))
              if script_open != script_close:
                  raise SystemExit(f'{filename}: nombre de balises script incohérent ({script_open} ouvrantes, {script_close} fermantes)')
              if len(re.findall(r'<html\b', source, flags=re.I)) != 1 or len(re.findall(r'</html\s*>', source, flags=re.I)) != 1:
                  raise SystemExit(f'{filename}: balises html absentes ou dupliquées')
              p=Scripts(); p.feed(source); p.close()
              if p.inside:
                  raise SystemExit(f'{filename}: balise <script> non fermée')
              if not p.parts:
                  raise SystemExit(f'{filename}: aucun script inline à vérifier')
              Path('/tmp/'+filename+'.js').write_text('\\n'.join(p.parts), encoding='utf-8')
          PY
          node --check /tmp/app.html.js
          node --check /tmp/index.html.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
