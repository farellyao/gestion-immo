function loginView(error=''){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>ESPACE DE GESTION</small></div></div><h1>Votre registre, en toute sécurité.</h1><p>Connectez-vous pour gérer les attestations foncières, les bénéficiaires, les lots et les pièces justificatives.</p>'+(error?'<div class="notice error">'+esc(error)+'</div>':'')+'<form id="loginform"><div class="field"><label>Adresse e-mail<input name="email" type="email" autocomplete="username" required placeholder="nom@organisation.ci"></label></div><div class="field"><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label></div><button class="btn primary" type="submit">Se connecter</button></form><p class="footnote">Accès réservé aux comptes autorisés. Les droits sont contrôlés par le registre sécurisé.</p></div></div>';document.getElementById('loginform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;b.textContent='Connexion…';let {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){b.disabled=false;b.textContent='Se connecter';loginView(error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message)}else await boot()}}
const navs=[['dashboard','▦','Vue d’ensemble'],['attestations','▤','Attestations'],['beneficiaries','♙','Bénéficiaires'],['lots','⌂','Lots & références'],['documents','▧','Pièces justificatives'],['cartography','⌖','Cartographie foncière'],['reports','▥','Rapports & statistiques'],['team','♧','Utilisateurs'],['settings','⚙','Paramètres'],['audit','≡','Journal d’activité']];
function layout(){let visible=navs.filter(n=>!(n[0]==='team'&&!isAdmin())&&!(n[0]==='audit'&&!isAdmin())&&!(n[0]==='settings'&&!isAdmin()));root.innerHTML='<div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>REGISTRE D’ATTESTATIONS</small></div></div><nav class="nav">'+visible.map(n=>'<button data-page="'+n[0]+'" class="'+(page===n[0]?'active':'')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</nav><div class="sidefoot">Registre foncier sécurisé<br>Accès contrôlé par profil<br><br>Version web · GFP</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menubtn">☰</button><div><b id="topname">Espace de gestion</b><br><small id="today"></small></div></div><div class="toptools"><div class="global-search-wrap"><span class="global-search-icon">⌕</span><input id="globalsearch" class="global-search" placeholder="Recherche globale…" autocomplete="off"><div id="globalresults" class="global-results hidden"></div></div><div style="position:relative"><button class="iconbtn" id="notifybtn" aria-label="Notifications">♧<span class="notify-count" id="notifycount">0</span></button><div id="notifypanel" class="notify-panel hidden"></div></div></div><div class="userchip"><div class="avatar">'+esc((profile?.full_name||session.user.email||'U').slice(0,1).toUpperCase())+'</div><div class="username">'+esc(profile?.full_name||session.user.email)+'<br><small style="color:#7b887e;font-weight:500">'+esc(({admin:'Administrateur',agent_foncier:'Agent foncier',consultation:'Consultation'})[profile?.role]||profile?.role)+'</small></div><button class="btn tiny" id="logout">Déconnexion</button></div></header><section class="content" id="view"></section></main></div>';
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='';render();document.getElementById('side').classList.remove('open')});document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;loginView()};document.getElementById('menubtn').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function titleFor(){return page==='beneficiaryDossier'?'Dossier bénéficiaire':(navs.find(n=>n[0]===page)||navs[0])[2]}
function pageHead(title,desc,action=''){return '<div class="head"><div><div class="eyebrow">Gestion Foncière Pro</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+action+'</div>'}
function statsCard(label,num,sub){return '<div class="stat"><div class="label">'+label+'</div><div class="num">'+num+'</div><small>'+sub+'</small></div>'}
function panel(title,sub,body,actions=''){return '<div class="panel"><div class="panelhead"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+actions+'</div>'+body+'</div>'}
function table(headers,rows,empty='Aucun enregistrement pour le moment.'){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows||'')+'</tbody></table></div>'}
function emptyRow(n,msg){return '<tr><td colspan="'+n+'"><div class="empty"><b>'+msg+'</b>Les données apparaîtront ici dès leur enregistrement.</div></td></tr>'}
function attName(a){return a.gfp_beneficiaries?.full_name||data.beneficiaries.find(b=>b.id===a.beneficiary_id)?.full_name||'Bénéficiaire'}
function lotName(a){let l=a.gfp_lots||data.lots.find(l=>l.id===a.lot_id);return l?[l.development,'Îlot '+l.block_number,'Lot '+l.lot_number].filter(Boolean).join(' · '):'Lot'}
function render(){if(!session||!profile)return;layout();let v=document.getElementById('view');document.getElementById('topname').textContent=titleFor();if(page==='dashboard')v.innerHTML=dashboard();else if(page==='attestations')v.innerHTML=attestationsView();else if(page==='beneficiaries')v.innerHTML=beneficiariesView();else if(page==='beneficiaryDossier')v.innerHTML=beneficiaryDossierView();else if(page==='lots')v.innerHTML=lotsView();else if(page==='documents')v.innerHTML=documentsView();else if(page==='cartography')v.innerHTML=cartographyView();else if(page==='team'&&isAdmin())v.innerHTML=teamView();else if(page==='settings'&&isAdmin())v.innerHTML=settingsView();else if(page==='audit'&&isAdmin())v.innerHTML=auditView();else if(page==='reports')v.innerHTML=reportsView();else{page='dashboard';render();return}wire();wireGlobalTools();startWelcomeClock()}
function welcomeHero(){let full=(profile?.full_name||session?.user?.email||'Utilisateur').trim();let first=full.split(/\s+/)[0]||'Utilisateur';let role=({admin:'Administrateur',agent_foncier:'Agent foncier',consultation:'Consultation'})[profile?.role]||'Espace sécurisé';return '<section class="welcome-hero"><div class="welcome-copy"><div class="welcome-kicker"><span class="welcome-live-dot"></span> Gestion Foncière Pro · Votre espace</div><h1 class="welcome-title"><span id="welcome-greeting">Bonjour</span>, '+esc(first)+' <span aria-hidden="true">✦</span></h1><p class="welcome-subtitle">Ravi de vous retrouver. Votre registre foncier est prêt : voici les dossiers à suivre et les dernières activités de votre espace.</p><div class="welcome-meta"><span class="welcome-chip">♙ <strong>'+esc(role)+'</strong></span><span class="welcome-chip">▦ <strong id="welcome-date">Chargement de la date…</strong></span></div></div><div class="welcome-clock"><div><div class="welcome-clock-time" id="welcome-time">--:--:--</div><div class="welcome-clock-label">Heure locale</div></div><div class="welcome-clock-date" id="welcome-clock-date">Mise à jour en direct</div></div></section><div class="head" style="margin-bottom:19px"><div><div class="eyebrow">VOTRE ACTIVITÉ</div><h1 style="font-size:23px;margin-top:5px">Vue d’ensemble</h1><p style="margin-top:5px">Le point sur les dossiers et les actions prioritaires.</p></div><button class="btn primary" data-modal="attestation" '+(!canWrite()?'disabled':'')+'>＋ Nouvelle attestation</button></div>'}
function startWelcomeClock(){if(welcomeClockTimer){clearInterval(welcomeClockTimer);welcomeClockTimer=null}let update=()=>{let now=new Date(),h=now.getHours(),greeting=h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';let g=document.getElementById('welcome-greeting'),t=document.getElementById('welcome-time'),d=document.getElementById('welcome-date'),cd=document.getElementById('welcome-clock-date');if(g)g.textContent=greeting;if(t)t.textContent=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);let date=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);if(d)d.textContent=date.charAt(0).toUpperCase()+date.slice(1);if(cd)cd.textContent=new Intl.DateTimeFormat('fr-FR',{timeZoneName:'short'}).format(now).split(' ').slice(-1)[0]+' · en direct'};update();if(document.getElementById('welcome-time'))welcomeClockTimer=setInterval(update,1000)}
function dashboard(){let a=data.attestations,active=a.filter(x=>x.status!=='Annulée'),pending=a.filter(x=>['En préparation','À vérifier','Validée en interne'].includes(x.status)),verifiedDocs=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push({key:key,label:d.toLocaleDateString('fr-FR',{month:'short'}),count:a.filter(x=>(x.created_at||'').slice(0,7)===key).length})}let max=Math.max(1,...months.map(m=>m.count));let rows=a.slice(0,6).map(x=>'<tr><td><div class="primarytext">'+esc(x.document_number)+'</div><div class="subtext">'+fmt(x.cession_date)+'</div></td><td>'+esc(attName(x))+'</td><td>'+esc(lotName(x))+'</td><td>'+badge(x.status)+'</td><td><button class="btn tiny" data-openatt="'+x.id+'">Ouvrir</button></td></tr>').join('');let queue=[];pending.slice(0,3).forEach(x=>queue.push({icon:'!',tone:'',title:'Attestation à traiter · '+x.document_number,desc:attName(x)+' — statut : '+x.status,page:'attestations'}));data.docs.filter(d=>!data.reviews.find(r=>r.document_id===d.id)||data.reviews.find(r=>r.document_id===d.id)?.review_status!=='verifiee').slice(0,3).forEach(d=>queue.push({icon:'▤',tone:'green',title:'Pièce à contrôler',desc:(data.beneficiaries.find(b=>b.id===d.beneficiary_id)?.full_name||'Bénéficiaire')+' — '+d.file_name,page:'documents'}));if(!queue.length)queue.push({icon:'✓',tone:'green',title:'Aucune action urgente',desc:'Aucune action prioritaire détectée.',page:'dashboard'});return welcomeHero()+'<div class="stats">'+statsCard('Attestations enregistrées',a.length,'Tous statuts confondus')+statsCard('Dossiers actifs',active.length,'Hors attestations annulées')+statsCard('À traiter',pending.length,'Préparation ou validation en attente')+statsCard('Bénéficiaires',data.beneficiaries.length,'Personnes dans le registre')+'</div><div class="dashboard-grid"><div>'+panel('Activité du registre','Attestations créées · 6 derniers mois','<div class="chart-bars">'+months.map(m=>'<div class="chart-col" title="'+m.count+' attestation(s)"><b style="font-size:11px;color:#53685a">'+m.count+'</b><div class="chart-bar" style="height:'+Math.max(5,m.count/max*100)+'%"></div><small>'+esc(m.label)+'</small></div>').join('')+'</div><div class="chart-legend"><span class="legend-dot"></span> Attestations créées par mois <span style="margin-left:auto">Total : '+a.length+'</span></div>')+'</div><div>'+panel('À traiter en priorité','Dossiers qui nécessitent une action','<div>'+queue.slice(0,5).map(q=>'<div class="queue-item"><div class="queue-icon '+q.tone+'">'+q.icon+'</div><div><b>'+esc(q.title)+'</b><small>'+esc(q.desc)+'</small><button class="link" data-goto="'+q.page+'">Consulter le dossier →</button></div></div>').join('')+'</div>')+'</div></div><div class="grid2" style="margin-top:18px"><div>'+panel('Dernières attestations','Les dossiers récemment enregistrés',table(['Référence','Bénéficiaire','Lot','Statut',''],rows||emptyRow(5,'Aucune attestation enregistrée.')) )+'</div><div>'+panel('État du registre','Accès rapide aux modules','<div style="padding:6px 20px 16px">'+[['Bénéficiaires',data.beneficiaries.length,'beneficiaries'],['Lots référencés',data.lots.length,'lots'],['Pièces justificatives',data.docs.length,'documents'],['Pièces vérifiées',verifiedDocs,'documents']].map(x=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf1eb"><div><b style="font-size:13px">'+x[0]+'</b><div class="subtext">Accéder au registre</div></div><div style="display:flex;align-items:center;gap:10px"><b>'+x[1]+'</b><button class="btn tiny" data-goto="'+x[2]+'">Voir</button></div></div>').join('')+'</div>')+'</div></div>'}
function searchBox(placeholder){return '<input class="search" id="search" placeholder="'+placeholder+'" value="'+esc(filter)+'">'}
function attestationsView(){let arr=data.attestations.filter(a=>(a.document_number+' '+attName(a)+' '+lotName(a)+' '+a.status).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(a=>'<tr><td><div class="primarytext">'+esc(a.document_number)+'</div><div class="subtext">Créée le '+fmt(a.created_at?.slice(0,10))+'</div></td><td>'+esc(attName(a))+'</td><td>'+esc(lotName(a))+'</td><td>'+fmt(a.cession_date)+'</td><td>'+badge(a.status)+'</td><td><div class="rowactions"><button class="btn tiny" data-openatt="'+a.id+'">Détails</button>'+(canWrite()&&a.status!=='Annulée'?'<button class="btn tiny" data-editatt="'+a.id+'">Modifier</button>':'')+'</div></td></tr>').join('');return pageHead('Attestations foncières','Créer, suivre, valider ou annuler les attestations enregistrées.','<button class="btn primary" data-modal="attestation" '+(!canWrite()?'disabled':'')+'>＋ Nouvelle attestation</button>')+panel('Registre des attestations',arr.length+' dossier(s)', '<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Rechercher numéro, bénéficiaire, lot…')+'</div>'+table(['Numéro','Bénéficiaire','Référence du lot','Cession','Statut','Actions'],rows||emptyRow(6,'Aucune attestation trouvée.')))}
function beneficiariesView(){let arr=data.beneficiaries.filter(b=>(b.full_name+' '+(b.phone||'')+' '+(b.id_number||'')).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(b=>'<tr><td><div class="primarytext">'+esc(b.full_name)+'</div><div class="subtext">'+esc(b.profession||'Profession non renseignée')+'</div></td><td>'+esc(b.phone||'—')+'</td><td>'+esc(b.id_type||'—')+'<div class="subtext">'+esc(b.id_number||'')+'</div></td><td>'+data.attestations.filter(a=>a.beneficiary_id===b.id).length+'</td><td><div class="rowactions"><button class="btn primary tiny" data-openben="'+b.id+'">Ouvrir le dossier</button><button class="btn tiny" data-editben="'+b.id+'">Modifier</button></div></td></tr>').join('');return pageHead('Bénéficiaires','Ouvrez chaque dossier pour retrouver ses attestations, ses pièces justificatives et ses lots.','<button class="btn primary" data-modal="beneficiary" '+(!canWrite()?'disabled':'')+'>＋ Nouveau bénéficiaire</button>')+panel('Répertoire',arr.length+' bénéficiaire(s)','<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Nom, téléphone ou pièce d’identité…')+'</div>'+table(['Identité','Téléphone','Pièce d’identité','Attestations','Actions'],rows||emptyRow(5,'Aucun bénéficiaire trouvé.')))}
function documentRow(d){let rev=data.reviews.find(r=>r.document_id===d.id);return '<div class="dossier-file"><div class="dossier-file-main"><div class="primarytext">'+esc(d.file_name)+'</div><div class="subtext">'+esc(d.document_type||'Pièce justificative')+' · '+fmt(d.created_at?.slice(0,10))+' · '+(({a_verifier:'À vérifier',verifiee:'Vérifiée',illisible:'Illisible',a_remplacer:'À remplacer'})[rev?.review_status]||'Non contrôlée')+'</div>'+(d.description?'<div class="subtext">'+esc(d.description)+'</div>':'')+'</div><div class="rowactions"><button class="btn tiny" data-viewdoc="'+d.id+'">Visionner</button>'+(canWrite()?'<button class="btn tiny" data-review="'+d.id+'">Contrôler</button>':'')+'</div></div>'}
function beneficiaryDossierView(){let b=data.beneficiaries.find(x=>x.id===dossierBeneficiaryId);if(!b){page='beneficiaries';return beneficiariesView()}let atts=data.attestations.filter(a=>a.beneficiary_id===b.id),docs=data.docs.filter(d=>d.beneficiary_id===b.id),lotIds=[...new Set(atts.map(a=>a.lot_id).filter(Boolean))],lots=lotIds.map(id=>data.lots.find(l=>l.id===id)).filter(Boolean);let attCards=atts.map(a=>{let links=data.attestationDocs.filter(x=>x.attestation_id===a.id),ad=links.map(x=>data.docs.find(d=>d.id===x.document_id)).filter(Boolean);return '<div class="panel dossier-att-card"><div class="panelhead"><div><h2>Attestation '+esc(a.document_number)+'</h2><p>'+esc(lotName(a))+' · Cession : '+fmt(a.cession_date)+' · '+badge(a.status)+'</p></div><div class="rowactions"><button class="btn tiny" data-openatt="'+a.id+'">Détails</button>'+(canWrite()&&a.status!=='Valide'?'<button class="btn tiny" data-editatt="'+a.id+'">Modifier</button>':'')+'</div></div><div class="dossier-card-body">'+(a.attestation_storage_path?'<div class="dossier-file"><div class="dossier-file-main"><div class="primarytext">'+esc(a.attestation_file_name||'Fichier d’attestation')+'</div><div class="subtext">Document officiel joint</div></div><button class="btn tiny" data-viewattfile="'+a.id+'">Visionner l’attestation</button></div>':'<div class="notice">Aucun fichier officiel n’est encore joint à cette attestation.</div>')+'<h3 class="dossier-subtitle">Pièces jointes à cette attestation ('+ad.length+')</h3>'+(ad.map(documentRow).join('')||'<div class="empty">Aucune pièce jointe associée à cette attestation.</div>')+(canWrite()?'<button class="btn tiny" data-adddocbeneficiary="'+b.id+'" data-adddocattestation="'+a.id+'">＋ Ajouter une pièce à cette attestation</button>':'')+'</div></div>'}).join('');let loose=docs.filter(d=>!data.attestationDocs.some(x=>x.document_id===d.id));return pageHead(b.full_name,'Dossier complet du bénéficiaire : identité, attestations, pièces justificatives et lots.','<button class="btn" data-backbeneficiaries>← Retour aux bénéficiaires</button>')+'<div class="grid2"><div class="panel"><div class="panelhead"><div><h2>Identité du bénéficiaire</h2><p>Informations du registre</p></div>'+(canWrite()?'<button class="btn tiny" data-editben="'+b.id+'">Modifier</button>':'')+'</div><div class="dossier-card-body"><div class="dossier-facts"><div><small>Téléphone</small><b>'+esc(b.phone||'—')+'</b></div><div><small>Pièce d’identité</small><b>'+esc([b.id_type,b.id_number].filter(Boolean).join(' · ')||'—')+'</b></div><div><small>Date de naissance</small><b>'+fmt(b.birth_date)+'</b></div><div><small>Profession</small><b>'+esc(b.profession||'—')+'</b></div><div class="wide"><small>Adresse</small><b>'+esc(b.address||'—')+'</b></div></div></div></div><div class="panel"><div class="panelhead"><div><h2>Résumé du dossier</h2><p>Vue synthétique</p></div></div><div class="dossier-card-body"><div class="dossier-summary"><div><small>Attestations</small><b>'+atts.length+'</b></div><div><small>Pièces</small><b>'+docs.length+'</b></div><div><small>Lots associés</small><b>'+lots.length+'</b></div></div><h3 class="dossier-subtitle">Lots liés au dossier</h3>'+(lots.map(l=>'<div class="dossier-file"><div class="dossier-file-main"><div class="primarytext">'+esc(l.development)+' · Îlot '+esc(l.block_number)+' · Lot '+esc(l.lot_number)+'</div><div class="subtext">'+esc(l.certificate_reference||'Référence cadastrale non renseignée')+(l.area_m2?' · '+esc(l.area_m2)+' m²':'')+'</div></div></div>').join('')||'<div class="empty">Aucun lot associé.</div>')+'</div></div></div>'+panel('Attestations et pièces jointes',atts.length+' attestation(s)',(canWrite()?'<div style="padding:14px 18px"><button class="btn primary" data-newattforben="'+b.id+'">＋ Nouvelle attestation pour ce bénéficiaire</button><button class="btn" data-adddocbeneficiary="'+b.id+'">＋ Ajouter une pièce générale</button></div>':'')+(attCards||'<div class="empty">Aucune attestation n’est encore associée à async function reviewDoc(id){if(!canWrite()){toast('Votre profil ne permet pas de contrôler les pièces.',true);return}let d=data.docs.find(x=>x.id===id);let old=data.reviews.find(x=>x.document_id===id);let el=modal('Contrôler une pièce','Consignez le résultat du contrôle documentaire.','<form id="modalform">'+fields([{name:'review_status',label:'Résultat',type:'select',required:true,value:old?.review_status||'a_verifier',options:[['a_verifier','À vérifier'],['verifiee','Vérifiée'],['illisible','Illisible'],['a_remplacer','À remplacer']]},{name:'comment',label:'Commentaire',type:'textarea',full:true,value:old?.comment||''}])+'</form>');el.querySelector('#modalform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let linkedAtt=data.attestations.find(a=>a.beneficiary_id===d.beneficiary_id);if(!linkedAtt){toast('Associez ce bénéficiaire à une attestation avant de contrôler cette pièce.',true);return}let payload={attestation_id:linkedAtt.id,document_id:id,review_status:f.get('review_status'),comment:f.get('comment')||null,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()};if(!payload.attestation_id){toast('Créez d’abord une attestation pour associer ce contrôle.',true);return}let q=old?await sb.from('gfp_document_reviews').update(payload).eq('id',old.id):await sb.from('gfp_document_reviews').insert(payload);if(q.error){toast(q.error.message,true);return}el.remove();await loadData();render();toast('Contrôle enregistré.')}}
async function viewDoc(id){let d=data.docs.find(x=>x.id===id);if(!d)return;let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(d.storage_path,300);if(error){toast(error.message,true);return}if(!window.open(link.signedUrl,'_blank'))toast('Autorisez les fenêtres surgissantes pour visionner le fichier.',true)}async function viewAttestationFile(id){let a=data.attestations.find(x=>x.id===id);if(!a?.attestation_storage_path){toast('Aucun fichier d’attestation n’est enregistré.',true);return}let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(a.attestation_storage_path,300);if(error){toast(error.message,true);return}if(!window.open(link.signedUrl,'_blank'))toast('Autorisez les fenêtres surgissantes pour visionner le fichier.',true)}
function wire(){let s=document.getElementById('search');if(s)s.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let ns=document.getElementById('search');if(ns){ns.focus();ns.setSelectionRange(pos,pos)}};document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-openben]').forEach(b=>b.onclick=()=>{dossierBeneficiaryId=b.dataset.openben;page='beneficiaryDossier';filter='';render()});document.querySelectorAll('[data-togglebeneficiary]').forEach(b=>b.onclick=()=>{let id=b.dataset.togglebeneficiary;expandedBeneficiaryGroups[id]=!expandedBeneficiaryGroups[id];render()});document.querySelectorAll('[data-toggleattestation]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggleattestation;expandedAttestationGroups[id]=!expandedAttestationGroups[id];render()});document.querySelectorAll('[data-adddocbeneficiary]').forEach(b=>b.onclick=()=>openModal('document',null,b.dataset.adddocbeneficiary,b.dataset.adddocattestation||null));document.querySelectorAll('[data-viewattfile]').forEach(b=>b.onclick=()=>viewAttestationFile(b.dataset.viewattfile));document.querySelectorAll('[data-newattforben]').forEach(b=>b.onclick=()=>openModal('attestation',null,b.dataset.newattforben));document.querySelectorAll('[data-backbeneficiaries]').forEach(b=>b.onclick=()=>{page='beneficiaries';render()});document.querySelectorAll('[data-openatt]').forEach(b=>b.onclick=()=>openAttDetails(b.dataset.openatt));document.querySelectorAll('[data-editatt]').forEach(b=>b.onclick=()=>openModal('attestation',b.dataset.editatt));document.querySelectorAll('[data-editben]').forEach(b=>b.onclick=()=>openModal('beneficiary',b.dataset.editben));document.querySelectorAll('[data-editlot]').forEach(b=>b.onclick=()=>openModal('lot',b.dataset.editlot));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;filter='';render()});document.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewdoc));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewDoc(b.dataset.review));document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=async()=>{let {data,error}=await sb.functions.invoke('gfp-admin-users',{body:{action:'set_active',user_id:b.dataset.toggleuser,active:b.dataset.active==='true'}});if(error||data?.error){toast(data?.error||error.message,true);return}await loadData();render();toast(data.message||'Accès modifié.')});let sf=document.getElementById('settingsform');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);let {error}=await sb.from('gfp_settings').update({company_name:f.get('company_name'),locality:f.get('locality'),document_prefix:f.get('document_prefix'),updated_by:session.user.id}).eq('id',settings.id);if(error){toast(error.message,true);return}await loadData();render();toast('Paramètres enregistrés.')};let ex=document.getElementById('exportaudit');if(ex)ex.onclick=()=>{let csv=['date,action,type,id,details',...data.audit.map(a=>[a.created_at,a.action,a.entity_type,a.entity_id,JSON.stringify(a.details)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=u;a.download='journal-gfp.csv';a.click();URL.revokeObjectURL(u)}}
async function loadData(){let queries=await Promise.all([sb.from('gfp_attestations').select('id,document_number,beneficiary_id,lot_id,cession_date,issue_place,internal_notes,status,cancelled_at,created_at,qr_verification_token,attestation_file_name,attestation_storage_path,attestation_mime_type,gfp_beneficiaries(full_name),gfp_lots(development,lot_number,block_number)').order('created_at',{ascending:false}),sb.from('gfp_beneficiaries').select('*').order('full_name'),sb.from('gfp_lots').select('*').order('development'),sb.from('gfp_beneficiary_documents').select('*').order('created_at',{ascending:false}),sb.from('gfp_document_reviews').select('*').order('created_at',{ascending:false}),sb.from('gfp_attestation_documents').select('*'),sb.from('gfp_settings').select('*').limit(1).maybeSingle()]);let [a,b,l,d,r,ad,s]=queries;for(let [name,q] of [['attestations',a],['beneficiaries',b],['lots',l],['docs',d],['reviews',r],['attestationDocs',ad]]){if(q.error)throw q.error;data[name]=q.data||[]}if(s.error)throw s.error;settings=s.data||{};if(isAdmin()){let [u,au,lh,ah]=await Promise.all([sb.functions.invoke('gfp-admin-users',{body:{action:'list'}}),sb.from('gfp_audit_log').select('*').order('created_at',{ascending:false}).limit(100),sb.from('gfp_lot_history').select('*').order('changed_at',{ascending:false}).limit(100),sb.from('gfp_attestation_history').select('*').order('changed_at',{ascending:false}).limit(100)]);if(u.error)throw u.error;if(u.data?.error)throw new Error(u.data.error);data.users=u.data?.users||[];if(au.error)throw au.error;data.audit=au.data||[];if(lh.error)throw lh.error;if(ah.error)throw ah.error;data.lotHistory=lh.data||[];data.attHistory=ah.data||[]}}
async function boot(){let {data:s}=await sb.auth.getSession();session=s.session;if(!session){loginView();return}let {data:p,error}=await sb.from('gfp_profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(error||!p||!p.active){await sb.auth.signOut();session=null;loginView('Ce compte n’a pas de profil GFP actif. Contactez un administrateur.');return}profile=p;try{await loadData();render()}catch(e){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><b>Gestion Foncière Pro</b></div><h1>Chargement impossible</h1><div class="notice error">'+esc(e.message||'Erreur de lecture du registre')+'</div><button class="btn primary" id="retry">Réessayer</button></div></div>';document.getElementById('retry').onclick=boot}}
sb.auth.onAuthStateChange((_event,s)=>{if(s&&!session){setTimeout(boot,0)}else if(!s&&session){session=null;profile=null;loginView()}});boot();
})();
</script></body></html>
