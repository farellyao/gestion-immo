function loginView(error=''){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>ESPACE DE GESTION</small></div></div><h1>Votre registre, en toute sécurité.</h1><p>Connectez-vous pour gérer les attestations foncières, les bénéficiaires, les lots et les pièces justificatives.</p>'+(error?'<div class="notice error">'+esc(error)+'</div>':'')+'<form id="loginform"><div class="field"><label>Adresse e-mail<input name="email" type="email" autocomplete="username" required placeholder="nom@organisation.ci"></label></div><div class="field"><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label></div><button class="btn primary" type="submit">Se connecter</button></form><p class="footnote">Accès réservé aux comptes autorisés. Les droits sont contrôlés par le registre sécurisé.</p></div></div>';document.getElementById('loginform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;b.textContent='Connexion…';let {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){b.disabled=false;b.textContent='Se connecter';loginView(error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message)}else await boot()}}

function dashboard(){let a=data.attestations,active=a.filter(x=>x.status!=='Annulée'),pending=a.filter(x=>['En préparation','À vérifier','Validée en interne'].includes(x.status)),verifiedDocs=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push({key:key,label:d.toLocaleDateString('fr-FR',{month:'short'}),count:a.filter(x=>(x.created_at||'').slice(0,7)===key).length})}let max=Math.max(1,...months.map(m=>m.count));let rows=a.slice(0,6).map(x=>'<tr><td><div class="primarytext">'+esc(x.document_number)+'</div><div class="subtext">'+fmt(x.cession_date)+'</div></td><td>'+esc(attName(x))+'</td><td>'+esc(lotName(x))+'</td><td>'+badge(x.status)+'</td><td><button class="btn tiny" data-openatt="'+x.id+'">Ouvrir</button></td></tr>').join('');let queue=[];pending.slice(0,3).forEach(x=>queue.push({icon:'!',tone:'',title:'Attestation à traiter · '+x.document_number,desc:attName(x)+' — statut : '+x.status,page:'attestations'}));data.docs.filter(d=>!data.reviews.find(r=>r.document_id===d.id)||data.reviews.find(r=>r.document_id===d.id)?.review_status!=='verifiee').slice(0,3).forEach(d=>queue.push({icon:'▤',tone:'green',title:'Pièce à contrôler',desc:(data.beneficiaries.find(b=>b.id===d.beneficiary_id)?.full_name||'Bénéficiaire')+' — '+d.file_name,page:'documents'}));if(!queue.length)queue.push({icon:'✓',tone:'green',title:'Aucune action urgente',desc:'Aucune action prioritaire détectée.',page:'dashboard'});return pageHead('Tableau de bord','Vue d’ensemble du registre foncier et des actions à effectuer.','<button class="btn primary" data-modal="attestation" '+(!canWrite()?'disabled':'')+'>＋ Nouvelle attestation</button>')+'<div class="stats">'+statsCard('Attestations enregistrées',a.length,'Tous statuts confondus')+statsCard('Dossiers actifs',active.length,'Hors attestations annulées')+statsCard('À traiter',pending.length,'Préparation ou validation en attente')+statsCard('Bénéficiaires',data.beneficiaries.length,'Personnes dans le registre')+'</div><div class="dashboard-grid"><div>'+panel('Activité du registre','Attestations créées · 6 derniers mois','<div class="chart-bars">'+months.map(m=>'<div class="chart-col" title="'+m.count+' attestation(s)"><b style="font-size:11px;color:#53685a">'+m.count+'</b><div class="chart-bar" style="height:'+Math.max(5,m.count/max*100)+'%"></div><small>'+esc(m.label)+'</small></div>').join('')+'</div><div class="chart-legend"><span class="legend-dot"></span> Attestations créées par mois <span style="margin-left:auto">Total : '+a.length+'</span></div>')+'</div><div>'+panel('À traiter en priorité','Dossiers qui nécessitent une action','<div>'+queue.slice(0,5).map(q=>'<div class="queue-item"><div class="queue-icon '+q.tone+'">'+q.icon+'</div><div><b>'+esc(q.title)+'</b><small>'+esc(q.desc)+'</small><button class="link" data-goto="'+q.page+'">Consulter le dossier →</button></div></div>').join('')+'</div>')+'</div></div><div class="grid2" style="margin-top:18px"><div>'+panel('Dernières attestations','Les dossiers récemment enregistrés',table(['Référence','Bénéficiaire','Lot','Statut',''],rows||emptyRow(5,'Aucune attestation enregistrée.')) )+'</div><div>'+panel('État du registre','Accès rapide aux modules','<div style="padding:6px 20px 16px">'+[['Bénéficiaires',data.beneficiaries.length,'beneficiaries'],['Lots référencés',data.lots.length,'lots'],['Pièces justificatives',data.docs.length,'documents'],['Pièces vérifiées',verifiedDocs,'documents']].map(x=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf1eb"><div><b style="font-size:13px">'+x[0]+'</b><div class="subtext">Accéder au registre</div></div><div style="display:flex;align-items:center;gap:10px"><b>'+x[1]+'</b><button class="btn tiny" data-goto="'+x[2]+'">Voir</button></div></div function lotsView(){let arr=data.lots.filter(l=>(l.development+' '+l.lot_number+' '+l.block_number+' '+(l.certificate_reference||'')).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(l=>'<tr><td><div class="primarytext">'+esc(l.development)+'</div><div class="subtext">'+esc(l.certificate_reference||'Référence non renseignée')+'</div></td><td>'+esc(l.block_number)+'</td><td>'+esc(l.lot_number)+'</td><td>'+data.attestations.filter(a=>a.lot_id===l.id&&a.status!=='Annulée').length+'</td><td><button class="btn tiny" data-editlot="'+l.id+'">Modifier</button></td></tr>').join('');return pageHead('Lots & références','Référentiel des lots et îlots utilisés par les attestations.','<button class="btn primary" data-modal="lot" '+(!canWrite()?'disabled':'')+'>＋ Nouveau lot</button>')+panel('Référentiel foncier',arr.length+' lot(s)','<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Lot, îlot, lotissement ou référence…')+'</div>'+table(['Lotissement / développement','Îlot','Lot','Attestations actives','Actions'],rows||emptyRow(5,'Aucun lot trouvé.')))}

function downloadCSV(filename,rows){let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');let u=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wireGlobalTools(){let input=document.getElementById('globalsearch'),results=document.getElementById('globalresults'),nb=document.getElementById('notifycount'),panel=document.getElementById('notifypanel'),btn=document.getElementById('notifybtn');if(!input||!results)return;let pending=data.attestations.filter(a=>['En préparation','À vérifier','Validée en interne'].includes(a.status)),unchecked=data.docs.filter(d=>!data.reviews.find(r=>r.document_id===d.id)||data.reviews.find(r=>r.document_id===d.id)?.review_status!=='verifiee'),notifications=[...pending.map(a=>({title:'Attestation à traiter',desc:a.document_number+' · '+attName(a),page:'attestations'})),...unchecked.map(d=>({title:'Pièce à contrôler',desc:d.file_name+' · '+(data.beneficiaries.find(b=>b.id===d.beneficiary_id)?.full_name||'Bénéficiaire'),page:'documents'}))];nb.textContent=notifications.length>9?'9+':notifications.length;nb.classList.toggle('hidden',notifications.length===0);panel.innerHTML='<div class="panelhead"><div><h2>Notifications</h2><p>'+notifications.length+' élément(s) nécessitant une attention</p></div></div>'+(notifications.length?notifications.slice(0,8).map(n=>'<div class="notify-item"><b>'+esc(n.title)+'</b><small>'+esc(n.desc)+'</small><button class="link" data-notifygoto="'+n.page+'">Ouvrir le module →</button></div>').join(''):'<div class="notify-item">Aucune notification.</div>');btn.onclick=()=>panel.classList.toggle('hidden');panel.querySelectorAll('[data-notifygoto]').forEach(b=>b.onclick=()=>{page=b.dataset.notifygoto;filter='';render()});input.oninput=()=>{let q=input.value.trim().toLowerCase();if(!q){results.classList.add('hidden');results.innerHTML='';return}let hits=[];data.attestations.filter(a=>(a.document_number+' '+attName(a)+' '+lotName(a)).toLowerCase().includes(q)).slice(0,5).forEach(a=>hits.push({icon:'▤',title:a.document_number,desc:attName(a)+' · '+lotName(a),action:'att',id:a.id}));data.beneficiaries.filter(b=>(b.full_name+' '+(b.phone||'')+' '+(b.id_number||'')).toLowerCase().includes(q)).slice(0,4).forEach(b=>hits.push({icon:'♙',title:b.full_name,desc:'Bénéficiaire · '+(b.phone||'Téléphone non renseigné'),action:'ben',id:b.id}));data.lots.filter(l=>(l.development+' '+l.block_number+' '+l.lot_number+' '+(l.certificate_reference||'')).toLowerCase().includes(q)).slice(0,4).forEach(l=>hits.push({icon:'⌂',title:l.development+' · Lot '+l.lot_number,desc:'Îlot '+l.block_number+' · '+(l.certificate_reference||'Sans référence'),action:'lot',id:l.id}));results.innerHTML=hits.length?hits.slice(0,9).map(h=>'<button data-hit="'+h.action+'" data-id="'+h.id+'"><span>'+h.icon+'</span><span><b>'+esc(h.title)+'</b><small>'+esc(h.desc)+'</small></span></button>').join(''):'<div class="notify-item">Aucun résultat dans le registre.</div>';results.classList.remove('hidden');results.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{let k=b.dataset.hit,id=b.dataset.id;results.classList.add('hidden');input.value='';if(k==='att')openAttDetails(id);else if(k==='ben')openModal('beneficiary',id);else openModal('lot',id)})};let ex=document.getElementById('exportreport');if(ex)ex.onclick=()=>{let a=data.attestations,valid=a.filter(x=>x.status==='Valide').length,cancel=a.filter(x=>x.status==='Annulée').length,docs=data.docs.length,reviewed=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;downloadCSV('rapport-gfp-'+dateNow()+'.csv',[['Indicateur','Valeur'],['Attestations',a.length],['Attestations validées',valid],['Attestations annulées',cancel],['Bénéficiaires',data.beneficiaries.length],['Lots enregistrés',data.lots.length],['Pièces justificatives',docs],['Pièces vérifiées',reviewed],['Pièces restant à contrôler',docs-reviewed]])};let exa=document.getElementById('exportaudit');if(exa)exa.onclick=()=>downloadCSV('journal-gfp.csv',[['date','action','type','id','details'],...data.audit.map(a=>[a.created_at,a.action,a.entity_type,a.entity_id,JSON.stringify(a.details)])])}

el=modal(title,desc,'<form id="modalform">'+body+'</form>',kind==='document'?'Téléverser la pièce':kind==='user'?'Envoyer l’invitation':'Enregistrer');let form=el.querySelector('#modalform');form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let btn=el.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enregistrement…';let f=new FormData(form);try{if(kind==='attestation'){let documentNumber=String(f.get('document_number')).trim();if(!id&&documentNumber===((settings.document_prefix||'TEN')+'-'+String(settings.next_number||1).padStart(5,'0'))){const numberResult=await sb.rpc('gfp_next_document_number');if(numberResult.error)throw numberResult.error;documentNumber=numberResult.data}let payload={document_number:documentNumber,beneficiary_id:f.get('beneficiary_id'),lot_id:f.get('lot_id'),cession_date:f.get('cession_date'),issue_place:String(f.get('issue_place')).trim(),status:f.get('status'),internal_notes:f.get('internal_notes')||null,updated_by:session.user.id};if(payload.status==='Annulée')payload.cancelled_at=obj.cancelled_at||new Date().toISOString();else payload.cancelled_at=null;if(id){let {error}=await sb.from('gfp_attestations').update(payload).eq('id',id);if(error)throw error}else{payload.created_by=session.user.id;let {error}=await sb.from('gfp_attestations').insert(payload);if(error)throw error} }

async function openAttDetails(id){let a=data.attestations.find(x=>x.id===id);if(!a)return;let qr=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?token='+a.qr_verification_token;let body='<div class="formgrid"><div class="field"><label>Numéro</label><input readonly value="'+esc(a.document_number)+'"></div><div class="field"><label>Statut</label><div>'+badge(a.status)+'</div></div><div class="field"><label>Bénéficiaire</label><input readonly value="'+esc(attName(a))+'"></div><div class="field"><label>Lot</label><input readonly value="'+esc(lotName(a))+'"></div><div class="field"><label>Date de cession</label><input readonly value="'+esc(fmt(a.cession_date))+'"></div><div class="field"><label>Lieu d’établissement</label><input readonly value="'+esc(a.issue_place)+'"></div><div class="field full"><label>Notes internes</label><textarea readonly>'+esc(a.internal_notes||'Aucune note')+'</textarea></div><div class="field full"><label>Lien de vérification QR</label><input readonly value="'+esc(qr)+'"><button type="button" class="btn" id="copyqr">Copier le lien</button></div></div>';let el=modal('Attestation '+esc(a.document_number),'Informations du registre. Les données sensibles restent derrière la connexion.',body,'Fermer');el.querySelector('[form="modalform"]')?.remove();el.querySelector('[data-close]').textContent='Fermer';el.querySelector('button[type=submit]')?.remove();el.querySelector('#copyqr').onclick=()=>navigator.clipboard.writeText(qr).then(()=>toast('Lien copié.')).catch(()=>toast('Copie impossible sur cet appareil.',true));if(canWrite()){let printBtn=document.createElement('button');printBtn.className='btn';printBtn.textContent='Imprimer / PDF';printBtn.onclick=()=>printAttestation(a);el.querySelector('.modalfoot').prepend(printBtn)}if(canWrite()&&a.status!=='Annulée'){let b=document.createElement('button');b.className='btn primary';b.textContent='Modifier';b.onclick=()=>{el.remove();openModal('attestation',id)};el.querySelector('.modalfoot').prepend(b);let next=nextStatus(a.status);if(next&&(isAdmin()||next!=='Valide')){let w=document.createElement('button');w.className='btn';w.textContent='Étape suivante : '+next;w.onclick=()=>changeAttestationStatus(a,next,el);el.querySelector('.modalfoot').prepend(w)}}}
function nextStatus(s){return ({'En préparation':'À vérifier','À vérifier':'Validée en interne','Validée en interne':'Valide'})[s]||null}
async function changeAttestationStatus(a,next,el){if(!canWrite()||(['Valide','Annulée'].includes(next)&&!isAdmin())){toast('Votre rôle ne permet pas cette validation.',true);return}if(!confirm('Confirmer le passage de « '+a.status+' » à « '+next+' » ?'))return;let payload={status:next,updated_by:session.user.id,cancelled_at:null};let {error}=await sb.from('gfp_attestations').update(payload).eq('id',a.id);if(error){toast(error.message,true);return}el?.remove();await loadData();render();toast('Statut mis à jour : '+next)}
function printAttestation(a){let valid=a.status==='Valide';let qr=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?token='+a.qr_verification_token;let w=window.open('','_blank','noopener,noreferrer');if(!w){toast('Autorisez les fenêtres surgissantes pour imprimer.',true);return}let org=esc(settings.company_name||'Gestion Foncière Pro'),locality=esc(a.issue_place||settings.locality||''),name=esc(attName(a)),lot=esc(lotName(a));w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+esc(a.document_number)+'</title><style>body{font-family:Arial,sans-serif;color:#182b22;margin:0;padding:36px}.doc{max-width:800px;margin:auto;border:2px solid #174a37;padding:36px;position:relative}.top{text-align:center;border-bottom:2px solid #d5e2d2;padding-bottom:18px}.top h1{font-size:22px;margin:10px 0}.top p{margin:4px;color:#53665a}.ref{text-align:right;margin:22px 0;font-weight:bold}.stamp{border:2px solid '+(valid?'#267044':'#b67a25')+';color:'+(valid?'#267044':'#9a6a16')+';display:inline-block;padding:7px 14px;transform:rotate(-2deg);font-weight:bold;letter-spacing:2px}.body{line-height:1.8;font-size:16px;margin:30px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.field{background:#f7f9f5;padding:12px}.label{font-size:11px;text-transform:uppercase;color:#6c7b70}.value{font-weight:bold;margin-top:5px}.foot{margin-top:38px;display:flex;justify-content:space-between;gap:25px}.sign{width:45%;border-top:1px solid #718076;padding-top:10px;text-align:center;font-size:12px}.watermark{position:absolute;top:42%;left:10%;font-size:50px;color:#aab8aa2b;transform:rotate(-25deg);font-weight:900;pointer-events:none}@media print{body{padding:0}.doc{border:2px solid #174a37;min-height:90vh}.no-print{display:none}}</style></head><body><main class="doc">'+(!valid?'<div class="watermark">APERÇU NON VALIDE</div>':'')+'<header class="top"><p>'+org+'</p><h1>ATTESTATION FONCIÈRE</h1><p>'+locality+'</p></header><div class="ref">Référence : '+esc(a.document_number)+'</div><div style="text-align:center"><span class="stamp">'+esc(a.status.toUpperCase())+'</span></div><div class="body">Il est attesté dans le registre que le dossier foncier ci-dessous est enregistré au nom du bénéficiaire désigné, selon les informations présentes dans le système de gestion.</div><div class="grid"><div class="field"><div class="label">Bénéficiaire</div><div class="value">'+name+'</div></div><div class="field"><div class="label">Référence du lot</div><div class="value">'+lot+'</div></div><div class="field"><div class="label">Date de cession</div><div class="value">'+esc(fmt(a.cession_date))+'</div></div><div class="field"><div class="label">Lieu d’établissement</div><div class="value">'+locality+'</div></div></div><p>Ce document imprimé est un aperçu du registre informatique. Sa validité doit être confirmée par la page de vérification officielle.</p><p><b>Vérification :</b> '+esc(qr)+'</p><div class="foot"><div class="sign">Signature et cachet de l’autorité compétente</div><div class="sign">Date d’émission</div></div><p class="no-print" style="text-align:center;margin-top:30px"><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></p></main></body></html>');w.document.close()}
async function reviewDoc(id){let d=data.docs.find(x=>x.id===id);let old=data.reviews.find(x=>x.document_id===id);let el=modal('Contrôler une pièce','Consignez le résultat du contrôle documentaire.','<form id="modalform">'+fields([{name:'review_status',label:'Résultat',type:'select',required:true,value:old?.review_status||'a_verifier',options:[['a_verifier','À vérifier'],['verifiee','Vérifiée'],['illisible','Illisible'],['a_remplacer','À remplacer']]},{name:'comment',label:'Commentaire',type:'textarea',full:true,value:old?.comment||''}])+'</form>');el.querySelector('#modalform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let linkedAtt=data.attestations.find(a=>a.beneficiary_id===d.beneficiary_id);if(!linkedAtt){toast('Associez ce bénéficiaire à une attestation avant de contrôler cette pièce.',true);return}let payload={attestation_id:linkedAtt.id,document_id:id,review_status:f.get('review_status'),comment:f.get('comment')||null,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()};if(!payload.attestation_id){toast('Créez d’abord une attestation pour associer ce contrôle.',true);return}let q=old?await sb.from('gfp_document_reviews').update(payload).eq('id',old.id):await sb.from('gfp_document_reviews').insert(payload);if(q.error){toast(q.error.message,true);return}el.remove();await loadData();render();toast('Contrôle enregistré.')}}
async function viewDoc(id){let d=data.docs.find(x=>x.id===id);if(!d)return;let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(d.storage_path,120);if(error){toast(error.message,true);return}window.open(link.signedUrl,'_blank','noopener,noreferrer')}
function wire(){let s=document.getElementById('search');if(s)s.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let ns=document.getElementById('search');if(ns){ns.focus();ns.setSelectionRange(pos,pos)}};document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-openatt]').forEach(b=>b.onclick=()=>openAttDetails(b.dataset.openatt));document.querySelectorAll('[data-editatt]').forEach(b=>b.onclick=()=>openModal('attestation',b.dataset.editatt));document.querySelectorAll('[data-editben]').forEach(b=>b.onclick=()=>openModal('beneficiary',b.dataset.editben));document.querySelectorAll('[data-editlot]').forEach(b=>b.onclick=()=>openModal('lot',b.dataset.editlot));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;filter='';render()});document.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewdoc));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewDoc(b.dataset.review));document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=async()=>{let {data,error}=await sb.functions.invoke('gfp-admin-users',{body:{action:'set_active',user_id:b.dataset.toggleuser,active:b.dataset.active==='true'}});if(error||data?.error){toast(data?.error||error.message,true);return}await loadData();render();toast(data.message||'Accès modifié.')});let sf=document.getElementById('settingsform');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);let {error}=await sb.from('gfp_settings').update({company_name:f.get('company_name'),locality:f.get('locality'),document_prefix:f.get('document_prefix'),updated_by:session.user.id}).eq('id',settings.id);if(error){toast(error.message,true);return}await loadData();render();toast('Paramètres enregistrés.')};let ex=document.getElementById('exportaudit');if(ex)ex.onclick=()=>{let csv=['date,action,type,id,details',...data.audit.map(a=>[a.created_at,a.action async function loadData(){let queries=await Promise.all([sb.from('gfp_attestations').select('id,document_number,beneficiary_id,lot_id,cession_date,issue_place,internal_notes,status,cancelled_at,created_at,qr_verification_token,gfp_beneficiaries(full_name),gfp_lots(development,lot_number,block_number)').order('created_at',{ascending:false}),sb.from('gfp_beneficiaries').select('*').order('full_name'),sb.from('gfp_lots').select('*').order('development'),sb.from('gfp_beneficiary_documents').select('*').order('created_at',{ascending:false}),sb.from('gfp_document_reviews').select('*').order('created_at',{ascending:false}),sb.from('gfp_settings').select('*').limit(1).maybeSingle()]);let [a,b,l,d,r,s]=queries;for(let [name,q] of [['attestations',a],['beneficiaries',b],['lots',l],['docs',d],['reviews',r]]){if(q.error)throw q.error;data[name]=q.data||[]}if(s.error)throw s.error;settings=s.data||{};if(isAdmin()){let [u,au]=await Promise.all([sb.functions.invoke('gfp-admin-users',{body:{action:'list'}}),sb.from('gfp_audit_log').select('*').order('created_at',{ascending:false}).limit(100)]);if(u.error)throw u.error;if(u.data?.error)throw new Error(u.data.error);data.users=u.data?.users||[];if(au.error)throw au.error;data.audit=au.data||[]}}
async function boot(){let {data:s}=await sb.auth.getSession();session=s.session;if(!session){loginView();return}let {data:p,error}=await sb.from('gfp_profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(error||!p||!p.active){await sb.auth.signOut();session=null;loginView('Ce compte n’a pas de profil GFP actif. Contactez un administrateur.');return}profile=p;try{await loadData();render()}catch(e){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><b>Gestion Foncière Pro</b></div><h1>Chargement impossible</h1><div class="notice error">'+esc(e.message||'Erreur de lecture du registre')+'</div><button class="btn primary" id="retry">Réessayer</button></div></div>';document.getElementById('retry').onclick=boot}}
sb.auth.onAuthStateChange((_event,s)=>{if(s&&!session){setTimeout(boot,0)}else if(!s&&session){session=null;profile=null;loginView()}});boot();
