function cartographyView(){let located=data.lots.filter(l=>Number.isFinite(Number(l.latitude))&&Number.isFinite(Number(l.longitude))&&l.latitude!==null&&l.longitude!==null);let rows=data.lots.map(l=>{let ok=l.latitude!==null&&l.longitude!==null&&Number.isFinite(Number(l.latitude))&&Number.isFinite(Number(l.longitude));let link=ok?'https://www.openstreetmap.org/?mlat='+encodeURIComponent(l.latitude)+'&mlon='+encodeURIComponent(l.longitude)+'#map=17/'+encodeURIComponent(l.latitude)+'/'+encodeURIComponent(l.longitude):'';return '<tr><td><div class="primarytext">'+esc(l.development)+'</div><div class="subtext">Îlot '+esc(l.block_number)+' · Lot '+esc(l.lot_number)+'</div></td><td>'+esc(l.area_m2?Number(l.area_m2).toLocaleString('fr-FR')+' m²':'—')+'</td><td>'+ (ok?'<code>'+esc(l.latitude)+', '+esc(l.longitude)+'</code>':'<span class="badge warn">Coordonnées manquantes</span>')+'</td><td>'+ (ok?'<a href="'+link+'" target="_blank" rel="noopener noreferrer">Voir sur OpenStreetMap ↗</a>':'<button class="btn tiny" data-editlot="'+l.id+'">Renseigner GPS</button>')+'</td></tr>'}).join('');let map=located.length?'<div class="panel"><div class="panelhead"><div><h2>Carte des lots géolocalisés</h2><p>Carte OpenStreetMap externe — '+located.length+' lot(s) avec coordonnées GPS</p></div></div><iframe title="Carte des lots fonciers" loading="lazy" style="width:100%;height:360px;border:0" src="https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(Math.min(...located.map(l=>Number(l.longitude)))-0.01)+','+encodeURIComponent(Math.min(...located.map(l=>Number(l.latitude)))-0.01)+','+encodeURIComponent(Math.max(...located.map(l=>Number(l.longitude)))+0.01)+','+encodeURIComponent(Math.max(...located.map(l=>Number(l.latitude)))+0.01)+'&layer=mapnik"></iframe></div>':'<div class="panel"><div class="empty"><b>Aucune parcelle géolocalisée pour le moment</b>Modifiez une fiche de lot et renseignez sa latitude et sa longitude pour commencer la cartographie.</div></div>';return pageHead('Cartographie foncière','Localiser les lots à partir de leurs coordonnées GPS.','<button class="btn" data-goto="lots">Gérer les lots</button>')+'<div class="report-cards"><div class="report-card"><small>Lots enregistrés</small><b>'+data.lots.length+'</b></div><div class="report-card"><small>Lots géolocalisés</small><b>'+located.length+'</b></div><div class="report-card"><small>À localiser</small><b>'+(data.lots.length-located.length)+'</b></div></div>'+map+panel('Référentiel géographique','Renseignez les coordonnées dans la fiche de chaque lot',table(['Lotissement / parcelle','Superficie','Coordonnées GPS','Carte / action'],rows||emptyRow(4,'Aucun lot enregistré.')))}
function reportsView(){let a=data.attestations,valid=a.filter(x=>x.status==='Valide').length,cancel=a.filter(x=>x.status==='Annulée').length,docs=data.docs.length,reviewed=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;let rows=[['Attestations',a.length],['Attestations validées',valid],['Attestations annulées',cancel],['Bénéficiaires',data.beneficiaries.length],['Lots enregistrés',data.lots.length],['Pièces justificatives',docs],['Pièces vérifiées',reviewed],['Pièces restant à contrôler',docs-reviewed]];return pageHead('Rapports & statistiques','Synthèse du registre et exports pour le suivi administratif.','<div class="rowactions"><button class="btn" id="printreport">Imprimer / PDF</button><button class="btn primary" id="exportreport">Exporter le rapport CSV</button></div>')+'<div class="report-cards"><div class="report-card"><small>Taux de validation</small><b>'+(a.length?Math.round(valid/a.length*100):0)+' %</b><small>'+valid+' attestation(s) validée(s)</small></div><div class="report-card"><small>Dossiers actifs</small><b>'+a.filter(x=>x.status!=='Annulée').length+'</b><small>Attestations non annulées</small></div><div class="report-card"><small>Contrôle documentaire</small><b>'+(docs?Math.round(reviewed/docs*100):0)+' %</b><small>'+reviewed+' pièce(s) vérifiée(s) sur '+docs+'</small></div></div>'+panel('Indicateurs du registre','Chiffres calculés à partir des données accessibles à votre profil',table(['Indicateur','Valeur'],rows.map(x=>'<tr><td>'+esc(x[0])+'</td><td><b>'+x[1]+'</b></td></tr>').join('')))+'<div class="notice">Le rapport peut être imprimé ou enregistré en PDF depuis la fenêtre d’impression. L’export CSV est compatible avec Excel et les tableurs courants.</div>'}
function downloadCSV(filename,rows){let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');let u=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function printReport(){let a=data.attestations,valid=a.filter(x=>x.status==='Valide').length,cancel=a.filter(x=>x.status==='Annulée').length,docs=data.docs.length,reviewed=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;let rows=[['Attestations enregistrées',a.length],['Attestations validées',valid],['Attestations annulées',cancel],['Attestations à traiter',a.filter(x=>['En préparation','À vérifier','Validée en interne'].includes(x.status)).length],['Bénéficiaires',data.beneficiaries.length],['Lots enregistrés',data.lots.length],['Lots géolocalisés',data.lots.filter(l=>l.latitude!==null&&l.longitude!==null).length],['Pièces justificatives',docs],['Pièces vérifiées',reviewed],['Pièces restant à contrôler',docs-reviewed]];let w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres surgissantes pour imprimer.',true);return}w.opener=null;w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Rapport GFP</title><style>body{font-family:Arial,sans-serif;color:#20372b;padding:30px}header{border-bottom:3px solid #174a37;padding-bottom:18px;margin-bottom:24px}h1{margin:0 0 8px}p{color:#637367}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dfe8dd}th{background:#f1f6ef}td:last-child{font-weight:bold;text-align:right}.note{margin-top:25px;font-size:12px;color:#637367}@media print{button{display:none}}</style></head><body><header><h1>Rapport de gestion foncière</h1><b>'+esc(settings.company_name||'Gestion Foncière Pro')+'</b><p>Édité le '+new Date().toLocaleString('fr-FR')+' · Indicateurs du registre GFP</p></header><table><thead><tr><th>Indicateur</th><th>Valeur</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table><p class="note">Rapport agrégé généré à partir des données accessibles à l’utilisateur connecté. Les attestations individuelles doivent être vérifiées dans le registre officiel.</p><p><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></p></body></html>');w.document.close()}
function wireGlobalTools(){let input=document.getElementById('globalsearch'),results=document.getElementById('globalresults'),nb=document.getElementById('notifycount'),panel=document.getElementById('notifypanel'),btn=document.getElementById('notifybtn');if(!input||!results)return;let pending=data.attestations.filter(a=>['En préparation','À vérifier','Validée en interne'].includes(a.status)),unchecked=data.docs.filter(d=>!data.reviews.find(r=>r.document_id===d.id)||data.reviews.find(r=>r.document_id===d.id)?.review_status!=='verifiee'),notifications=[...pending.map(a=>({title:'Attestation à traiter',desc:a.document_number+' · '+attName(a),page:'attestations'})),...unchecked.map(d=>({title:'Pièce à contrôler',desc:d.file_name+' · '+(data.beneficiaries.find(b=>b.id===d.beneficiary_id)?.full_name||'Bénéficiaire'),page:'documents'}))];nb.textContent=notifications.length>9?'9+':notifications.length;nb.classList.toggle('hidden',notifications.length===0);panel.innerHTML='<div class="panelhead"><div><h2>Notifications</h2><p>'+notifications.length+' élément(s) nécessitant une attention</p></div></div>'+(notifications.length?notifications.slice(0,8).map(n=>'<div class="notify-item"><b>'+esc(n.title)+'</b><small>'+esc(n.desc)+'</small><button class="link" data-notifygoto="'+n.page+'">Ouvrir le module →</button></div>').join(''):'<div class="notify-item">Aucune notification.</div>');btn.onclick=()=>panel.classList.toggle('hidden');panel.querySelectorAll('[data-notifygoto]').forEach(b=>b.onclick=()=>{page=b.dataset.notifygoto;filter='';render()});input.oninput=()=>{let q=input.value.trim().toLowerCase();if(!q){results.classList.add('hidden');results.innerHTML='';return}let hits=[];data.attestations.filter(a=>(a.document_number+' '+attName(a)+' '+lotName(a)).toLowerCase().includes(q)).slice(0,5).forEach(a=>hits.push({icon:'▤',title:a.document_number,desc:attName(a)+' · '+lotName(a),action:'att',id:a.id}));data.beneficiaries.filter(b=>(b.full_name+' '+(b.phone||'')+' '+(b.id_number||'')).toLowerCase().includes(q)).slice(0,4).forEach(b=>hits.push({icon:'♙',title:b.full_name,desc:'Bénéficiaire · '+(b.phone||'Téléphone non renseigné'),action:'ben',id:b.id}));data.lots.filter(l=>(l.development+' '+l.block_number+' '+l.lot_number+' '+(l.certificate_reference||'')).toLowerCase().includes(q)).slice(0,4).forEach(l=>hits.push({icon:'⌂',title:l.development+' · Lot '+l.lot_number,desc:'Îlot '+l.block_number+' · '+(l.certificate_reference||'Sans référence'),action:'lot',id:l.id}));results.innerHTML=hits.length?hits.slice(0,9).map(h=>'<button data-hit="'+h.action+'" data-id="'+h.id+'"><span>'+h.icon+'</span><span><b>'+esc(h.title)+'</b><small>'+esc(h.desc)+'</small></span></button>').join(''):'<div class="notify-item">Aucun résultat dans le registre.</div>';results.classList.remove('hidden');results.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{let k=b.dataset.hit,id=b.dataset.id;results.classList.add('hidden');input.value='';if(k==='att')openAttDetails(id);else if(k==='ben')openModal('beneficiary',id);else openModal('lot',id)})};let pr=document.getElementById('printreport');if(pr)pr.onclick=()=>printReport();let ex=document.getElementById('exportreport');if(ex)ex.onclick=()=>{let a=data.attestations,valid=a.filter(x=>x.status==='Valide').length,cancel=a.filter(x=>x.status==='Annulée').length,docs=data.docs.length,reviewed=data.docs.filter(d=>data.reviews.find(r=>r.document_id===d.id)?.review_status==='verifiee').length;downloadCSV('rapport-gfp-'+dateNow()+'.csv',[['Indicateur','Valeur'],['Attestations',a.length],['Attestations validées',valid],['Attestations annulées',cancel],['Bénéficiaires',data.beneficiaries.length],['Lots enregistrés',data.lots.length],['Pièces justificatives',docs],['Pièces vérifiées',reviewed],['Pièces restant à contrôler',docs-reviewed]])};let exa=document.getElementById('exportaudit');if(exa)exa.onclick=()=>downloadCSV('journal-gfp.csv',[['date','action','type','id','details'],...data.audit.map(a=>[a.created_at,a.action,a.entity_type,a.entity_id,JSON.stringify(a.details)]),...data.attHistory.map(h=>[h.changed_at,h.operation,'attestation',h.attestation_id,JSON.stringify({avant:h.old_data,apres:h.new_data})]),...data.lotHistory.map(h=>[h.changed_at,h.operation,'lot',h.lot_id,JSON.stringify({avant:h.old_data,apres:h.new_data})])])}

async function viewDoc(id){let d=data.docs.find(x=>x.id===id);if(!d)return;let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(d.storage_path,300);if(error){toast(error.message,true);return}if(!window.open(link.signedUrl,'_blank'))toast('Autorisez les fenêtres surgissantes pour visionner le fichier.',true)}async function viewAttestationFile(id){let a=data.attestations.find(x=>x.id===id);if(!a?.attestation_storage_path){toast('Aucun fichier d’attestation n’est enregistré.',true);return}let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(a.attestation_storage_path,300);if(error){toast(error.message,true);return}if(!window.open(link.signedUrl,'_blank'))toast('Autorisez les fenêtres surgissantes pour visionner le fichier.',true)}function previewAttestation(id){let a=data.attestations.find(x=>x.id===id);if(!a)return;if(a.attestation_storage_path){viewAttestationFile(id);return}printAttestation(a)}
function wire(){let s=document.getElementById('search');if(s)s.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let ns=document.getElementById('search');if(ns){ns.focus();ns.setSelectionRange(pos,pos)}};document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-openben]').forEach(b=>b.onclick=()=>{dossierBeneficiaryId=b.dataset.openben;page='beneficiaryDossier';filter='';render()});document.querySelectorAll('[data-togglebeneficiary]').forEach(b=>b.onclick=()=>{let id=b.dataset.togglebeneficiary;expandedBeneficiaryGroups[id]=!expandedBeneficiaryGroups[id];render()});document.querySelectorAll('[data-toggleattestation]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggleattestation;expandedAttestationGroups[id]=expandedAttestationGroups[id]===false?true:false;render()});document.querySelectorAll('[data-continueatt]').forEach(b=>b.onclick=()=>openAttDetails(b.dataset.continueatt));document.querySelectorAll('[data-adddocbeneficiary]').forEach(b=>b.onclick=()=>openModal('document',null,b.dataset.adddocbeneficiary,b.dataset.adddocattestation||null));document.querySelectorAll('[data-viewattfile]').forEach(b=>b.onclick=()=>viewAttestationFile(b.dataset.viewattfile));document.querySelectorAll('[data-previewatt]').forEach(b=>b.onclick=()=>previewAttestation(b.dataset.previewatt));document.querySelectorAll('[data-newattforben]').forEach(b=>b.onclick=()=>openModal('attestation',null,b.dataset.newattforben));document.querySelectorAll('[data-backbeneficiaries]').forEach(b=>b.onclick=()=>{page='beneficiaries';render()});document.querySelectorAll('[data-toggledossieratt]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggledossieratt;expandedDossierAttestations[id]=!expandedDossierAttestations[id];render()});document.querySelectorAll('[data-openatt]').forEach(b=>b.onclick=()=>openAttDetails(b.dataset.openatt));document.querySelectorAll('[data-editatt]').forEach(b=>b.onclick=()=>openModal('attestation',b.dataset.editatt));document.querySelectorAll('[data-editben]').forEach(b=>b.onclick=()=>openModal('beneficiary',b.dataset.editben));document.querySelectorAll('[data-editlot]').forEach(b=>b.onclick=()=>openModal('lot',b.dataset.editlot));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;filter='';render()});document.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewdoc));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewDoc(b.dataset.review));document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=async()=>{let {data,error}=await sb.functions.invoke('gfp-admin-users',{body:{action:'set_active',user_id:b.dataset.toggleuser,active:b.dataset.active==='true'}});if(error||data?.error){toast(data?.error||error.message,true);return}await loadData();render();toast(data.message||'Accès modifié.')});let sf=document.getElementById('settingsform');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);let {error}=await sb.from('gfp_settings').update({company_name:f.get('company_name'),locality:f.get('locality'),document_prefix:f.get('document_prefix'),updated_by:session.user.id}).eq('id',settings.id);if(error){toast(error.message,true);return}await loadData();render();toast('Paramètres enregistrés.')};let ex=document.getElementById('exportaudit');if(ex)ex.onclick=()=>{let csv=['date,action,type,id,details',...data.audit.map(a=>[a.created_at,a.action,a.entity_type,a.entity_id,JSON.stringify(a.details)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=u;a.download='journal-gfp.csv';a.click();URL.revokeObjectURL(u)}}
async function loadData(){let profileQuery=await sb.from('gfp_profiles').select('id,full_name,role,active').eq('active',true);if(profileQuery.error)throw profileQuery.error;data.profiles=profileQuery.data||[];let queries=await Promise.all([sb.from('gfp_attestations').select('id,document_number,beneficiary_id,lot_id,cession_date,issue_place,internal_notes,status,cancelled_at,created_at,updated_at,created_by,updated_by,verified_by,verified_at,validated_by,validated_at,qr_verification_token,attestation_file_name,attestation_storage_path,attestation_mime_type,gfp_beneficiaries(full_name),gfp_lots(development,lot_number,block_number)').order('created_at',{ascending:false}),sb.from('gfp_beneficiaries').select('*').order('full_name'),sb.from('gfp_lots').select('*').order('development'),sb.from('gfp_beneficiary_documents').select('*').order('created_at',{ascending:false}),sb.from('gfp_document_reviews').select('*').order('created_at',{ascending:false}),sb.from('gfp_attestation_documents').select('*'),sb.from('gfp_settings').select('*').limit(1).maybeSingle()]);let [a,b,l,d,r,ad,s]=queries;for(let [name,q] of [['attestations',a],['beneficiaries',b],['lots',l],['docs',d],['reviews',r],['attestationDocs',ad]]){if(q.error)throw q.error;data[name]=q.data||[]}if(s.error)throw s.error;settings=s.data||{};if(isAdmin()){let [u,au,lh,ah]=await Promise.all([sb.functions.invoke('gfp-admin-users',{body:{action:'list'}}),sb.from('gfp_audit_log').select('*').order('created_at',{ascending:false}).limit(100),sb.from('gfp_lot_history').select('*').order('changed_at',{ascending:false}).limit(100),sb.from('gfp_attestation_history').select('*').order('changed_at',{ascending:false}).limit(100)]);if(u.error)throw u.error;if(u.data?.error)throw new Error(u.data.error);data.users=u.data?.users||[];if(au.error)throw au.error;data.audit=au.data||[];if(lh.error)throw lh.error;if(ah.error)throw ah.error;data.lotHistory=lh.data||[];data.attHistory=ah.data||[]}}
async function boot(){try{let {data:s,error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;session=s.session;if(!session){loginView();return}let {data:p,error}=await sb.from('gfp_profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(error)throw error;if(!p||!p.active){await sb.auth.signOut();session=null;profile=null;loginView('Ce compte n’a pas de profil GFP actif. Contactez un administrateur.');return}profile=p;try{await loadData();render()}catch(e){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><b>Gestion Foncière Pro</b></div><h1>Chargement impossible</h1><div class="notice error">'+esc(e.message||'Erreur de lecture du registre')+'</div><button class="btn primary" id="retry">Réessayer</button></div></div>';document.getElementById('retry').onclick=boot}}catch(e){session=null;profile=null;root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><b>Gestion Foncière Pro</b></div><h1>Connexion indisponible</h1><div class="notice error">'+esc(e.message||'Impossible de vérifier la session sécurisée. Vérifiez la connexion puis réessayez.')+'</div><button class="btn primary" id="retry">Réessayer</button></div></div>';document.getElementById('retry').onclick=boot}}
sb.auth.onAuthStateChange((_event,s)=>{if(s&&!session){setTimeout(boot,0)}else if(!s&&session){session=null;profile=null;loginView()}});boot();
})();
