<style id="gfp-premium-layer">
/* GFP — finition premium : contraste, hiérarchie, états et responsive */
:root{--gfp-ink:#172d23;--gfp-forest:#123d32;--gfp-green:#245b43;--gfp-lime:#c8dda9;--gfp-gold:#b58a4a;--gfp-paper:#f4f6f1;--gfp-stroke:#dfe7dd}
body{color:var(--gfp-ink);background:radial-gradient(ellipse at 80% 0%,#edf2e8 0,transparent 42%),var(--gfp-paper)}

body .nav{gap:7px}
body .nav button{position:relative;padding:12px 13px;border:1px solid transparent;border-radius:11px;color:#c7d9ce;transition:background .18s,border-color .18s,transform .18s}

body .sidefoot{border-top:1px solid #ffffff20;color:#b0c8b8;line-height:1.8}

body .stat:after{width:3px;background:linear-gradient(180deg,#c9dda8,#8fb17d)}
body .stat .label{font-size:11px;letter-spacing:.035em;text-transform:uppercase;color:#758277}

body .btn.danger{background:#fffafa;border-color:#f0d8d5}

body .global-results,body .notify-panel{border-color:#dce6da;box-shadow:0 20px 50px #153d2525}
body .toast{border:1px solid #ffffff20;box-shadow:0 14px 38px #0e2b1f30}
body :focus-visible{outline:3px solid #b7d5a0;outline-offset:2px}
@media(max-width:900px){body .shell{grid-template-columns:1fr}body .side{padding:22px 16px}body .content{padding:22px 16px 34px}body .top{padding-left:17px;padding-right:17px}}
@media(max-width:520px){body .content{padding:18px 12px 28px}body .head h1{font-size:25px}body .stat,body .report-card{border-radius:13px}body .panelhead{padding:15px}body .stat{padding:13px}body .stat .label{font-size:10px}}

'<div class="stats">'+statsCard('Attestations enregistrées',a.length,'Volume total du registre')+statsCard('Dossiers actifs',active.length,'Hors dossiers annulés')+statsCard('Actions en attente',pending.length,'À compléter ou à valider')+statsCard('Pièces vérifiées',verifiedDocs+' / '+data.docs.length,'Justificatifs contrôlés')+'</div>'+

'<section class="gfp-panel gfp-priority">'+panel('Centre d’action','Les prochaines actions à effectuer','<div class="gfp-queue-head"><span class="gfp-queue-count">'+queue.filter(q=>q.priority<9).length+'</span><span>point(s) à suivre</span></div><div class="gfp-queue">'+queue.slice(0,5).map(q=>'<div class="gfp-queue-item"><div class="queue-icon '+q.tone+'">'+q.icon+'</div><div class="gfp-queue-copy"><b>'+esc(q.title)+'</b><small>'+esc(q.desc)+'</small><button class="link" data-goto="'+q.page+'">Ouvrir le module <span aria-hidden="true">→</span></button></div></div>').join('')+'</div>')+'</section></div>'+
