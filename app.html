<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182b22;background:#f4f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:#123d2b;color:#e9f3eb;padding:24px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.mark{width:39px;height:39px;background:#d6e9b8;color:#143d2b;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{display:block;font-size:15px}.brand small{color:#a9c4b0;font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c4d9ca;text-align:left;padding:12px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#24553e;color:#fff}.nav button span{display:inline-block;width:27px;color:#b7d5a0}.sidefoot{margin-top:auto;border-top:1px solid #315c45;padding:17px 8px;color:#a9c4b0;font-size:12px;line-height:1.6}.main{min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid #e2e9e1;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}.top small{color:#738077}.userchip{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}.avatar{background:#e3eddf;color:#24583a;width:35px;height:35px;border-radius:50%;display:grid;place-items:center}.content{padding:30px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}.eyebrow{color:#52715b;font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:850}.head h1{font-size:27px;letter-spacing:-.04em;margin:6px 0}.head p{color:#738077;margin:0;font-size:14px}.btn{border:1px solid #d5e0d5;background:white;color:#234332;padding:10px 14px;border-radius:9px;font-weight:750;font-size:13px}.btn.primary{background:#1b5838;color:white;border-color:#1b5838}.btn.danger{color:#a52d2d}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid #e0e8df;border-radius:14px}.stat{padding:18px}.stat .label{font-size:12px;color:#718076;font-weight:650}.stat .num{font-size:29px;font-weight:850;letter-spacing:-.04em;margin:9px 0 4px}.stat small{color:#8a968e;font-size:11px}.panel{overflow:hidden;margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #edf1eb;gap:12px}.panelhead h2{font-size:15px;margin:0}.panelhead p{font-size:12px;color:#819087;margin:5px 0 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,select,input,textarea{border:1px solid #dbe4d9;border-radius:8px;padding:10px 11px;background:#fff;color:#23382a;min-width:0}.search{width:min(280px,100%)}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#718076;background:#fafcf9;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}th,td{padding:13px 17px;border-bottom:1px solid #edf1eb;vertical-align:middle}tr:last-child td{border-bottom:0}.primarytext{font-weight:750;color:#203b2b}.subtext{font-size:11px;color:#8a968e;margin-top:4px}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;background:#f0f2ef;color:#667269;font-size:11px;font-weight:800;white-space:nowrap}.badge.good{background:#e0f4e4;color:#176338}.badge.warn{background:#fff0cf;color:#8a5b00}.badge.bad{background:#fde4e2;color:#a52c2c}.empty{padding:40px 20px;text-align:center;color:#859188}.empty b{display:block;color:#3d5143;margin-bottom:6px}.hidden{display:none!important}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.tiny{padding:6px 9px;font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#53665a;font-weight:750}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:85px;resize:vertical}.notice{padding:12px 14px;border-radius:9px;background:#eef6eb;color:#315b38;font-size:13px;margin-bottom:15px}.notice.error{background:#fff0ed;color:#a52c2c}.modalback{position:fixed;inset:0;background:#102a1db8;display:grid;place-items:center;padding:15px;z-index:10;overflow:auto}.modal{background:white;border-radius:16px;width:min(680px,100%);padding:24px;box-shadow:0 20px 70px #0003;margin:auto}.modal h2{margin:0 0 6px;font-size:21px}.modal p{color:#77847a;font-size:13px;margin:0 0 20px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#e2eedb,#f4f6f2 55%)}.login{background:white;width:min(440px,100%);padding:35px;border:1px solid #e0e8df;border-radius:20px;box-shadow:0 25px 70px #153d2512}.login h1{font-size:25px;letter-spacing:-.04em;margin:24px 0 8px}.login p{color:#738077;font-size:13px;line-height:1.5}.login form{display:grid;gap:13px;margin-top:22px}.login label{font-size:12px;font-weight:750}.login input{width:100%;margin-top:6px}.login .btn{padding:12px}.footnote{font-size:11px;color:#8a968e;margin-top:20px}.link{border:0;background:none;color:#24643e;text-decoration:underline;font-size:12px}.mobilemenu{display:none}.toast{position:fixed;right:22px;bottom:22px;z-index:30;background:#163e2c;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 28px #0002;font-size:13px;max-width:min(440px,calc(100vw - 30px))}.toast.error{background:#982f2f}

</style></head><body><div id="root"><div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>ESPACE DE GESTION</small></div></div><h1>Chargement sécurisé…</h1><p>Connexion au registre d’attestations.</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
const URL='https://npwkpohhqrrzziycgoak.supabase.co',KEY='sb_publishable_NQEL7GMk01QRGOCIE4GfVQ_2hwk_7Kn';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const statuses=['En préparation','À vérifier','Validée en interne','Valide','Annulée'];
const statusClass=s=>s==='Valide'?'good':s==='Annulée'?'bad':s==='À vérifier'?'warn':'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR'):'—';
const dateNow=()=>new Date().toISOString().slice(0,10);
let session=null,profile=null,settings={},data={attestations:[],beneficiaries:[],lots:[],docs:[],reviews:[],users:[],audit:[]},page='dashboard',filter='',busy=false;
const root=document.getElementById('root');
function toast(msg,err=false){let t=document.createElement('div');t.className='toast'+(err?' error':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function canWrite(){return ['admin','agent_foncier'].includes(profile?.role)}
function isAdmin(){return profile?.role==='admin'}
function badge(s){return '<span class="badge '+statusClass(s)+'">'+esc(s)+'</span>'}
function loginView(error=''){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>ESPACE DE GESTION</small></div></div><h1>Votre registre, en toute sécurité.</h1><p>Connectez-vous pour gérer les attestations foncières, les bénéficiaires, les lots et les pièces justificatives.</p>'+(error?'<div class="notice error">'+esc(error)+'</div>':'')+'<form id="loginform"><div class="field"><label>Adresse e-mail<input name="email" type="email" autocomplete="username" required placeholder="nom@organisation.ci"></label></div><div class="field"><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label></div><button class="btn primary" type="submit">Se connecter</button></form><p class="footnote">Accès réservé aux comptes autorisés. Les droits sont contrôlés par le registre sécurisé.</p></div></div>';document.getElementById('loginform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;b.textContent='Connexion…';let {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){b.disabled=false;b.textContent='Se connecter';loginView(error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message)}else await boot()}}
const navs=[['dashboard','▦','Vue d’ensemble'],['attestations','▤','Attestations'],['beneficiaries','♙','Bénéficiaires'],['lots','⌂','Lots & références'],['documents','▧','Pièces justificatives'],['team','♧','Utilisateurs'],['settings','⚙','Paramètres'],['audit','≡','Journal d’activité']];
function layout(){let visible=navs.filter(n=>!(n[0]==='team'&&!isAdmin())&&!(n[0]==='audit'&&!isAdmin())&&!(n[0]==='settings'&&!isAdmin()));root.innerHTML='<div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark">G</div><div><b>Gestion Foncière Pro</b><small>REGISTRE D’ATTESTATIONS</small></div></div><nav class="nav">'+visible.map(n=>'<button data-page="'+n[0]+'" class="'+(page===n[0]?'active':'')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'</nav><div class="sidefoot">Registre foncier sécurisé<br>Accès contrôlé par profil<br><br>Version web · GFP</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menubtn">☰</button><div><b id="topname">Espace de gestion</b><br><small id="today"></small></div></div><div class="userchip"><div class="avatar">'+esc((profile?.full_name||session.user.email||'U').slice(0,1).toUpperCase())+'</div><div class="username">'+esc(profile?.full_name||session.user.email)+'<br><small style="color:#7b887e;font-weight:500">'+esc(({admin:'Administrateur',agent_foncier:'Agent foncier',consultation:'Consultation'})[profile?.role]||profile?.role)+'</small></div><button class="btn tiny" id="logout">Déconnexion</button></div></header><section class="content" id="view"></section></main></div>';
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='';render();document.getElementById('side').classList.remove('open')});document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;loginView()};document.getElementById('menubtn').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});render()}
function titleFor(){return (navs.find(n=>n[0]===page)||navs[0])[2]}
function pageHead(title,desc,action=''){return '<div class="head"><div><div class="eyebrow">Gestion Foncière Pro</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+action+'</div>'}
function statsCard(label,num,sub){return '<div class="stat"><div class="label">'+label+'</div><div class="num">'+num+'</div><small>'+sub+'</small></div>'}
function panel(title,sub,body,actions=''){return '<div class="panel"><div class="panelhead"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+actions+'</div>'+body+'</div>'}
function table(headers,rows,empty='Aucun enregistrement pour le moment.'){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows||'')+'</tbody></table></div>'}
function emptyRow(n,msg){return '<tr><td colspan="'+n+'"><div class="empty"><b>'+msg+'</b>Les données apparaîtront ici dès leur enregistrement.</div></td></tr>'}
function attName(a){return a.gfp_beneficiaries?.full_name||data.beneficiaries.find(b=>b.id===a.beneficiary_id)?.full_name||'Bénéficiaire'}
function lotName(a){let l=a.gfp_lots||data.lots.find(l=>l.id===a.lot_id);return l?[l.development,'Îlot '+l.block_number,'Lot '+l.lot_number].filter(Boolean).join(' · '):'Lot'}
function render(){if(!session||!profile)return;layout();let v=document.getElementById('view');document.getElementById('topname').textContent=titleFor();if(page==='dashboard')v.innerHTML=dashboard();else if(page==='attestations')v.innerHTML=attestationsView();else if(page==='beneficiaries')v.innerHTML=beneficiariesView();else if(page==='lots')v.innerHTML=lotsView();else if(page==='documents')v.innerHTML=documentsView();else if(page==='team'&&isAdmin())v.innerHTML=teamView();else if(page==='settings'&&isAdmin())v.innerHTML=settingsView();else if(page==='audit'&&isAdmin())v.innerHTML=auditView();else{page='dashboard';render();return}wire()}
function dashboard(){let a=data.attestations;let rows=a.slice(0,7).map(x=>'<tr><td><div class="primarytext">'+esc(x.document_number)+'</div><div class="subtext">'+fmt(x.cession_date)+'</div></td><td>'+esc(attName(x))+'</td><td>'+esc(lotName(x))+'</td><td>'+badge(x.status)+'</td><td><button class="btn tiny" data-openatt="'+x.id+'">Ouvrir</button></td></tr>').join('');return pageHead('Vue d’ensemble','Suivi opérationnel du registre et des dossiers fonciers.','<button class="btn primary" data-modal="attestation">＋ Nouvelle attestation</button>')+'<div class="stats">'+statsCard('Attestations enregistrées',a.length,'Tous statuts confondus')+statsCard('Validées',a.filter(x=>x.status==='Valide').length,'Statut confirmé dans le registre')+statsCard('À vérifier',a.filter(x=>x.status==='À vérifier').length,'Dossiers en attente de contrôle')+statsCard('Annulées',a.filter(x=>x.status==='Annulée').length,'Conservées dans l’historique')+'</div><div class="grid2"><div>'+panel('Dernières attestations','Les dossiers les plus récents',table(['Référence','Bénéficiaire','Lot','Statut',''],rows||emptyRow(5,'Aucune attestation enregistrée.')) )+'</div><div>'+panel('Registre','Éléments suivis', '<div style="padding:8px 20px 18px">'+[['Bénéficiaires',data.beneficiaries.length,'beneficiaries'],['Lots référencés',data.lots.length,'lots'],['Pièces justificatives',data.docs.length,'documents'],['Dossiers à contrôler',a.filter(x=>x.status==='À vérifier').length,'attestations']].map(x=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf1eb"><div><b style="font-size:13px">'+x[0]+'</b><div class="subtext">Accéder aux données du registre</div></div><div style="display:flex;align-items:center;gap:10px"><b>'+x[1]+'</b><button class="btn tiny" data-goto="'+x[2]+'">Voir</button></div></div>').join('')+'</div>')+'</div></div>'}
function searchBox(placeholder){return '<input class="search" id="search" placeholder="'+placeholder+'" value="'+esc(filter)+'">'}
function attestationsView(){let arr=data.attestations.filter(a=>(a.document_number+' '+attName(a)+' '+lotName(a)+' '+a.status).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(a=>'<tr><td><div class="primarytext">'+esc(a.document_number)+'</div><div class="subtext">Créée le '+fmt(a.created_at?.slice(0,10))+'</div></td><td>'+esc(attName(a))+'</td><td>'+esc(lotName(a))+'</td><td>'+fmt(a.cession_date)+'</td><td>'+badge(a.status)+'</td><td><div class="rowactions"><button class="btn tiny" data-openatt="'+a.id+'">Détails</button>'+(canWrite()&&a.status!=='Annulée'?'<button class="btn tiny" data-editatt="'+a.id+'">Modifier</button>':'')+'</div></td></tr>').join('');return pageHead('Attestations foncières','Créer, suivre, valider ou annuler les attestations enregistrées.','<button class="btn primary" data-modal="attestation" '+(!canWrite()?'disabled':'')+'>＋ Nouvelle attestation</button>')+panel('Registre des attestations',arr.length+' dossier(s)', '<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Rechercher numéro, bénéficiaire, lot…')+'</div>'+table(['Numéro','Bénéficiaire','Référence du lot','Cession','Statut','Actions'],rows||emptyRow(6,'Aucune attestation trouvée.')))}
function beneficiariesView(){let arr=data.beneficiaries.filter(b=>(b.full_name+' '+(b.phone||'')+' '+(b.id_number||'')).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(b=>'<tr><td><div class="primarytext">'+esc(b.full_name)+'</div><div class="subtext">'+esc(b.profession||'Profession non renseignée')+'</div></td><td>'+esc(b.phone||'—')+'</td><td>'+esc(b.id_type||'—')+'<div class="subtext">'+esc(b.id_number||'')+'</div></td><td>'+data.attestations.filter(a=>a.beneficiary_id===b.id).length+'</td><td><button class="btn tiny" data-editben="'+b.id+'">Consulter / modifier</button></td></tr>').join('');return pageHead('Bénéficiaires','Répertoire des personnes rattachées aux attestations.','<button class="btn primary" data-modal="beneficiary" '+(!canWrite()?'disabled':'')+'>＋ Nouveau bénéficiaire</button>')+panel('Répertoire',arr.length+' bénéficiaire(s)','<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Nom, téléphone ou pièce d’identité…')+'</div>'+table(['Identité','Téléphone','Pièce d’identité','Attestations','Actions'],rows||emptyRow(5,'Aucun bénéficiaire trouvé.')))}
function lotsView(){let arr=data.lots.filter(l=>(l.development+' '+l.lot_number+' '+l.block_number+' '+(l.certificate_reference||'')).toLowerCase().includes(filter.toLowerCase()));let rows=arr.map(l=>'<tr><td><div class="primarytext">'+esc(l.development)+'</div><div class="subtext">'+esc(l.certificate_reference||'Référence non renseignée')+'</div></td><td>'+esc(l.block_number)+'</td><td>'+esc(l.lot_number)+'</td><td>'+data.attestations.filter(a=>a.lot_id===l.id&&a.status!=='Annulée').length+'</td><td><button class="btn tiny" data-editlot="'+l.id+'">Modifier</button></td></tr>').join('');return pageHead('Lots & références','Référentiel des lots et îlots utilisés par les attestations.','<button class="btn primary" data-modal="lot" '+(!canWrite()?'disabled':'')+'>＋ Nouveau lot</button>')+panel('Référentiel foncier',arr.length+' lot(s)','<div style="padding:14px 17px;border-bottom:1px solid #edf1eb">'+searchBox('Lot, îlot, lotissement ou référence…')+'</div>'+table(['Lotissement / développement','Îlot','Lot','Attestations actives','Actions'],rows||emptyRow(5,'Aucun lot trouvé.')))}
function documentsView(){let docs=data.docs.map(d=>{let b=data.beneficiaries.find(x=>x.id===d.beneficiary_id);let rev=data.reviews.find(r=>r.document_id===d.id);return '<tr><td><div class="primarytext">'+esc(d.file_name)+'</div><div class="subtext">'+esc(d.document_type)+'</div></td><td>'+esc(b?.full_name||'Bénéficiaire')+'</td><td>'+badge(({a_verifier:'À vérifier',verifiee:'Vérifiée',illisible:'Illisible',a_remplacer:'À remplacer'})[rev?.review_status]||'Non contrôlée')+'</td><td>'+fmt(d.created_at?.slice(0,10))+'</td><td><div class="rowactions"><button class="btn tiny" data-viewdoc="'+d.id+'">Ouvrir</button><button class="btn tiny" data-review="'+d.id+'">Contrôler</button></div></td></tr>'}).join('');return pageHead('Pièces justificatives','Documents d’identité stockés en privé et contrôles de conformité.','<button class="btn primary" data-modal="document" '+(!canWrite()?'disabled':'')+'>＋ Ajouter une pièce</button>')+panel('Dossier documentaire',data.docs.length+' pièce(s)','<div class="notice" style="margin:14px 17px 0">Les fichiers sont stockés dans un espace privé. Leur ouverture nécessite une session autorisée.</div>'+table(['Fichier','Bénéficiaire','Contrôle','Ajouté le','Actions'],rows||emptyRow(5,'Aucune pièce justificative enregistrée.')))}
function teamView(){let rows=data.users.map(u=>'<tr><td><div class="primarytext">'+esc(u.full_name||'Utilisateur')+'</div><div class="subtext">'+esc(u.email)+'</div></td><td>'+esc(({admin:'Administrateur',agent_foncier:'Agent foncier',consultation:'Consultation'})[u.role]||u.role)+'</td><td>'+badge(u.active?'Actif':'Désactivé')+'</td><td>'+fmt(u.last_sign_in_at?.slice(0,10))+'</td><td><button class="btn tiny" data-toggleuser="'+u.id+'" data-active="'+(!u.active)+'">'+(u.active?'Désactiver':'Activer')+'</button></td></tr>').join('');return pageHead('Utilisateurs','Gestion des accès et des rôles.','<button class="btn primary" data-modal="user">＋ Inviter un utilisateur</button>')+panel('Équipe autorisée',data.users.length+' compte(s)',table(['Utilisateur','Rôle','Accès','Dernière connexion','Actions'],rows||emptyRow(5,'Aucun utilisateur.')))}
function settingsView(){return pageHead('Paramètres','Informations utilisées pour l’émission des attestations.')+ '<div class="panel"><div class="panelhead"><div><h2>Organisme émetteur</h2><p>Ces informations peuvent apparaître sur les documents futurs.</p></div></div><form id="settingsform" style="padding:20px"><div class="formgrid"><div class="field"><label>Nom de l’organisme</label><input name="company_name" required value="'+esc(settings.company_name||'')+'"></div><div class="field"><label>Localité par défaut</label><input name="locality" required value="'+esc(settings.locality||'')+'"></div><div class="field"><label>Préfixe de numérotation</label><input name="document_prefix" required maxlength="12" value="'+esc(settings.document_prefix||'TEN')+'"></div><div class="field"><label>Prochain numéro (informatif)</label><input value="'+esc(settings.next_number??'')+'" disabled></div></div><div class="modalfoot"><button class="btn primary">Enregistrer les paramètres</button></div></form></div><div class="notice">La numérotation doit rester unique. Les attestations existantes ne seront pas renommées lors d’un changement de préfixe.</div>'}
function auditView(){let rows=data.audit.map(a=>'<tr><td>'+new Date(a.created_at).toLocaleString('fr-FR')+'</td><td><b>'+esc(a.action)+'</b></td><td>'+esc(a.entity_type)+'</td><td><code>'+esc(a.entity_id||'—')+'</code></td><td>'+esc(JSON.stringify(a.details||{}))+'</td></tr>').join('');return pageHead('Journal d’activité','Historique technique des opérations consignées.','<button class="btn" id="exportaudit">Exporter CSV</button>')+panel('Événements récents',data.audit.length+' événement(s)',table(['Date','Action','Type','Identifiant','Détails'],rows||emptyRow(5,'Aucun événement enregistré.')))}
function modal(title,desc,body,submit='Enregistrer'){let el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modal"><h2>'+title+'</h2><p>'+desc+'</p>'+body+'<div class="modalfoot"><button type="button" class="btn" data-close>Annuler</button><button type="submit" form="modalform" class="btn primary">'+submit+'</button></div></div>';document.body.appendChild(el);el.querySelector('[data-close]').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};return el}
function fields(items){return '<div class="formgrid">'+items.map(i=>'<div class="field '+(i.full?'full':'')+'"><label>'+i.label+'</label>'+(i.type==='select'?'<select name="'+i.name+'" '+(i.required?'required':'')+'>'+(i.options||[]).map(o=>'<option value="'+esc(o[0])+'" '+(o[0]===i.value?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':i.type==='textarea'?'<textarea name="'+i.name+'">'+esc(i.value||'')+'</textarea>':'<input name="'+i.name+'" type="'+(i.type||'text')+'" '+(i.required?'required':'')+' value="'+esc(i.value||'')+'" '+(i.placeholder?'placeholder="'+esc(i.placeholder)+'"':'')+'>')+'</div>').join('')+'</div>'}
function openModal(kind,id){if(!canWrite()&&['attestation','beneficiary','lot','document'].includes(kind)){toast('Votre profil ne permet pas cette opération.',true);return}let obj=null,el,body='',title='',desc='';
if(kind==='attestation'){obj=data.attestations.find(x=>x.id===id)||{};title=id?'Modifier l’attestation':'Nouvelle attestation';desc='Choisissez le bénéficiaire, le lot et le statut à enregistrer.';body=fields([{name:'document_number',label:'Numéro d’attestation',required:true,value:obj.document_number||((settings.document_prefix||'TEN')+'-'+String(settings.next_number||1).padStart(4,'0'))},{name:'beneficiary_id',label:'Bénéficiaire',type:'select',required:true,value:obj.beneficiary_id,options:[['','Choisir…'],...data.beneficiaries.map(b=>[b.id,b.full_name])]},{name:'lot_id',label:'Lot référencé',type:'select',required:true,value:obj.lot_id,options:[['','Choisir…'],...data.lots.map(l=>[l.id,l.development+' · Îlot '+l.block_number+' · Lot '+l.lot_number])]},{name:'cession_date',label:'Date de cession',type:'date',required:true,value:obj.cession_date||dateNow()},{name:'issue_place',label dumm: 'Lieu d’établissement'}].filter(x=>!x.dumm));body=fields([{name:'document_number',label:'Numéro d’attestation',required:true,value:obj.document_number||((settings.document_prefix||'TEN')+'-'+String(settings.next_number||1).padStart(4,'0'))},{name:'beneficiary_id',label:'Bénéficiaire',type:'select',required:true,value:obj.beneficiary_id,options:[['','Choisir…'],...data.beneficiaries.map(b=>[b.id,b.full_name])]},{name:'lot_id',label:'Lot référencé',type:'select',required:true,value:obj.lot_id,options:[['','Choisir…'],...data.lots.map(l=>[l.id,l.development+' · Îlot '+l.block_number+' · Lot '+l.lot_number])]},{name:'cession_date',label:'Date de cession',type:'date',required:true,value:obj.cession_date||dateNow()},{name:'issue_place',label:'Lieu d’établissement',required:true,value:obj.issue_place||settings.locality||'TENIKRO'},{name:'status',label:'Statut',type:'select',required:true,value:obj.status||'En préparation',options:statuses.map(s=>[s,s])},{name:'internal_notes',label:'Notes internes',type:'textarea',full:true,value:obj.internal_notes||''}]);}
else if(kind==='beneficiary'){obj=data.beneficiaries.find(x=>x.id===id)||{};title=id?'Modifier le bénéficiaire':'Nouveau bénéficiaire';desc='Les données d’identité sont accessibles uniquement aux utilisateurs autorisés.';body=fields([{name:'full_name',label:'Nom complet',required:true,value:obj.full_name},{name:'phone',label:'Téléphone',value:obj.phone},{name:'birth_date',label:'Date de naissance',type:'date',value:obj.birth_date},{name:'birthplace',label:'Lieu de naissance',value:obj.birthplace},{name:'profession',label:'Profession',value:obj.profession},{name:'address',label:'Adresse',value:obj.address},{name:'id_type',label:'Type de pièce',type:'select',value:obj.id_type,options:[['','Non renseigné'],['CNI','Carte nationale d’identité'],['Passeport','Passeport'],['Attestation','Attestation d’identité'],['Autre','Autre']]},{name:'id_number',label:'Numéro de pièce',value:obj.id_number},{name:'id_issue_date',label:'Date de délivrance',type:'date',value:obj.id_issue_date},{name:'id_expiry_date',label:'Date d’expiration',type:'date',value:obj.id_expiry_date},{name:'id_issue_place',label:'Lieu de délivrance',value:obj.id_issue_place}]);}
else if(kind==='lot'){obj=data.lots.find(x=>x.id===id)||{};title=id?'Modifier le lot':'Nouveau lot';desc='Les lots référencés peuvent être associés aux attestations.';body=fields([{name:'development',label:'Lotissement / développement',required:true,value:obj.development},{name:'block_number',label:'Numéro d’îlot',required:true,value:obj.block_number},{name:'lot_number',label:'Numéro de lot',required:true,value:obj.lot_number},{name:'certificate_reference',label:'Référence cadastrale / certificat',value:obj.certificate_reference},{name:'availability_note',label:'Note interne',type:'textarea',full:true,value:obj.availability_note}]);}
else if(kind==='document'){title='Ajouter une pièce justificative';desc='PDF, JPEG ou PNG, 10 Mo maximum. Le fichier reste privé.';body='<div class="formgrid"><div class="field full"><label>Bénéficiaire</label><select name="beneficiary_id" required><option value="">Choisir…</option>'+data.beneficiaries.map(b=>'<option value="'+b.id+'">'+esc(b.full_name)+'</option>').join('')+'</select></div><div class="field"><label>Type de pièce</label><select name="document_type" required><option>Pièce d’identité</option><option>Justificatif de cession</option><option>Document foncier</option><option>Autre</option></select></div><div class="field"><label>Description (facultatif)</label><input name="description"></div><div class="field full"><label>Fichier</label><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required></div></div>';}
else if(kind==='user'){title='Inviter un utilisateur';desc='L’invitation dépend du service e-mail configuré dans Supabase.';body=fields([{name:'full_name',label:'Nom complet',required:true},{name:'email',label:'Adresse e-mail',type:'email',required:true},{name:'role',label:'Rôle',type:'select',required:true,options:[['consultation','Consultation (lecture)'],['agent_foncier','Agent foncier (gestion des dossiers)'],['admin','Administrateur']]}]);}
el=modal(title,desc,'<form id="modalform">'+body+'</form>',kind==='document'?'Téléverser la pièce':kind==='user'?'Envoyer l’invitation':'Enregistrer');let form=el.querySelector('#modalform');form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let btn=el.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Enregistrement…';let f=new FormData(form);try{if(kind==='attestation'){let payload={document_number:String(f.get('document_number')).trim(),beneficiary_id:f.get('beneficiary_id'),lot_id:f.get('lot_id'),cession_date:f.get('cession_date'),issue_place:String(f.get('issue_place')).trim(),status:f.get('status'),internal_notes:f.get('internal_notes')||null,updated_by:session.user.id};if(payload.status==='Annulée')payload.cancelled_at=obj.cancelled_at||new Date().toISOString();else payload.cancelled_at=null;if(id){let {error}=await sb.from('gfp_attestations').update(payload).eq('id',id);if(error)throw error}else{payload.created_by=session.user.id;let {error}=await sb.from('gfp_attestations').insert(payload);if(error)throw error} }
else if(kind==='beneficiary'){let payload={};['full_name','phone','birth_date','birthplace','profession','address','id_type','id_number','id_issue_date','id_expiry_date','id_issue_place'].forEach(k=>payload[k]=f.get(k)||null);payload.updated_by=session.user.id;if(id){let {error}=await sb.from('gfp_beneficiaries').update(payload).eq('id',id);if(error)throw error}else{payload.created_by=session.user.id;let {error}=await sb.from('gfp_beneficiaries').insert(payload);if(error)throw error}}
else if(kind==='lot'){let payload={};['development','block_number','lot_number','certificate_reference','availability_note'].forEach(k=>payload[k]=f.get(k)||null);payload.updated_by=session.user.id;if(id){let {error}=await sb.from('gfp_lots').update(payload).eq('id',id);if(error)throw error}else{payload.created_by=session.user.id;let {error}=await sb.from('gfp_lots').insert(payload);if(error)throw error}}
else if(kind==='document'){let file=f.get('file');if(!file||file.size>10485760)throw new Error('Fichier manquant ou supérieur à 10 Mo.');if(!['application/pdf','image/jpeg','image/png'].includes(file.type))throw new Error('Format refusé. Utilisez PDF, JPEG ou PNG.');let path=session.user.id+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let up=await sb.storage.from('gfp-beneficiary-documents').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;let {error}=await sb.from('gfp_beneficiary_documents').insert({beneficiary_id:f.get('beneficiary_id'),document_type:f.get('document_type'),description:f.get('description')||null,file_name:file.name,storage_path:path,uploaded_by:session.user.id});if(error){await sb.storage.from('gfp-beneficiary-documents').remove([path]);throw error}}
else if(kind==='user'){let {data,error}=await sb.functions.invoke('gfp-admin-users',{body:{action:'invite',email:f.get('email'),full_name:f.get('full_name'),role:f.get('role')}});if(error)throw error;if(data?.error)throw new Error(data.error);toast(data?.message||'Invitation traitée.')}
el.remove();await loadData();render();if(kind!=='user')toast('Enregistrement effectué.');}catch(err){toast(err.message||'Une erreur est survenue.',true);btn.disabled=false;btn.textContent='Réessayer'}finally{busy=false}}}
async function openAttDetails(id){let a=data.attestations.find(x=>x.id===id);if(!a)return;let qr=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?token='+a.qr_verification_token;let body='<div class="formgrid"><div class="field"><label>Numéro</label><input readonly value="'+esc(a.document_number)+'"></div><div class="field"><label>Statut</label><div>'+badge(a.status)+'</div></div><div class="field"><label>Bénéficiaire</label><input readonly value="'+esc(attName(a))+'"></div><div class="field"><label>Lot</label><input readonly value="'+esc(lotName(a))+'"></div><div class="field"><label>Date de cession</label><input readonly value="'+esc(fmt(a.cession_date))+'"></div><div class="field"><label>Lieu d’établissement</label><input readonly value="'+esc(a.issue_place)+'"></div><div class="field full"><label>Notes internes</label><textarea readonly>'+esc(a.internal_notes||'Aucune note')+'</textarea></div><div class="field full"><label>Lien de vérification QR</label><input readonly value="'+esc(qr)+'"><button type="button" class="btn" id="copyqr">Copier le lien</button></div></div>';let el=modal('Attestation '+esc(a.document_number),'Informations du registre. Les données sensibles restent derrière la connexion.',body,'Fermer');el.querySelector('[form="modalform"]')?.remove();el.querySelector('[data-close]').textContent='Fermer';el.querySelector('button[type=submit]')?.remove();el.querySelector('#copyqr').onclick=()=>navigator.clipboard.writeText(qr).then(()=>toast('Lien copié.')).catch(()=>toast('Copie impossible sur cet appareil.',true));if(canWrite()&&a.status!=='Annulée'){let b=document.createElement('button');b.className='btn primary';b.textContent='Modifier';b.onclick=()=>{el.remove();openModal('attestation',id)};el.querySelector('.modalfoot').prepend(b)}}
async function reviewDoc(id){let d=data.docs.find(x=>x.id===id);let old=data.reviews.find(x=>x.document_id===id);let el=modal('Contrôler une pièce','Consignez le résultat du contrôle documentaire.','<form id="reviewform">'+fields([{name:'review_status',label:'Résultat',type:'select',required:true,value:old?.review_status||'a_verifier',options:[['a_verifier','À vérifier'],['verifiee','Vérifiée'],['illisible','Illisible'],['a_remplacer','À remplacer']]},{name:'comment',label:'Commentaire',type:'textarea',full:true,value:old?.comment||''}])+'</form>');el.querySelector('#reviewform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let payload={attestation_id:data.attestations.find(a=>a.beneficiary_id===d.beneficiary_id)?.id||data.attestations[0]?.id,document_id:id,review_status:f.get('review_status'),comment:f.get('comment')||null,reviewed_by:session.user.id,reviewed_at:new Date().toISOString()};if(!payload.attestation_id){toast('Créez d’abord une attestation pour associer ce contrôle.',true);return}let q=old?await sb.from('gfp_document_reviews').update(payload).eq('id',old.id):await sb.from('gfp_document_reviews').insert(payload);if(q.error){toast(q.error.message,true);return}el.remove();await loadData();render();toast('Contrôle enregistré.')}}
async function viewDoc(id){let d=data.docs.find(x=>x.id===id);if(!d)return;let {data:link,error}=await sb.storage.from('gfp-beneficiary-documents').createSignedUrl(d.storage_path,120);if(error){toast(error.message,true);return}window.open(link.signedUrl,'_blank','noopener,noreferrer')}
function wire(){let s=document.getElementById('search');if(s)s.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let ns=document.getElementById('search');if(ns){ns.focus();ns.setSelectionRange(pos,pos)}};document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-openatt]').forEach(b=>b.onclick=()=>openAttDetails(b.dataset.openatt));document.querySelectorAll('[data-editatt]').forEach(b=>b.onclick=()=>openModal('attestation',b.dataset.editatt));document.querySelectorAll('[data-editben]').forEach(b=>b.onclick=()=>openModal('beneficiary',b.dataset.editben));document.querySelectorAll('[data-editlot]').forEach(b=>b.onclick=()=>openModal('lot',b.dataset.editlot));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;filter='';render()});document.querySelectorAll('[data-viewdoc]').forEach(b=>b.onclick=()=>viewDoc(b.dataset.viewdoc));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewDoc(b.dataset.review));document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=async()=>{let {data,error}=await sb.functions.invoke('gfp-admin-users',{body:{action:'set_active',user_id:b.dataset.toggleuser,active:b.dataset.active==='true'}});if(error||data?.error){toast(data?.error||error.message,true);return}await loadData();render();toast(data.message||'Accès modifié.')});let sf=document.getElementById('settingsform');if(sf)sf.onsubmit=async e=>{e.preventDefault();let f=new FormData(sf);let {error}=await sb.from('gfp_settings').update({company_name:f.get('company_name'),locality:f.get('locality'),document_prefix:f.get('document_prefix'),updated_by:session.user.id}).not('id','is',null);if(error){toast(error.message,true);return}await loadData();render();toast('Paramètres enregistrés.')};let ex=document.getElementById('exportaudit');if(ex)ex.onclick=()=>{let csv=['date,action,type,id,details',...data.audit.map(a=>[a.created_at,a.action,a.entity_type,a.entity_id,JSON.stringify(a.details)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=u;a.download='journal-gfp.csv';a.click();URL.revokeObjectURL(u)}}
async function loadData(){let queries=await Promise.all([sb.from('gfp_attestations').select('id,document_number,beneficiary_id,lot_id,cession_date,issue_place,internal_notes,status,cancelled_at,created_at,qr_verification_token,gfp_beneficiaries(full_name),gfp_lots(development,lot_number,block_number)').order('created_at',{ascending:false}),sb.from('gfp_beneficiaries').select('*').order('full_name'),sb.from('gfp_lots').select('*').order('development'),sb.from('gfp_beneficiary_documents').select('*').order('created_at',{ascending:false}),sb.from('gfp_document_reviews').select('*').order('created_at',{ascending:false}),sb.from('gfp_settings').select('*').limit(1).maybeSingle()]);let [a,b,l,d,r,s]=queries;for(let [name,q] of [['attestations',a],['beneficiaries',b],['lots',l],['docs',d],['reviews',r]]){if(q.error)throw q.error;data[name]=q.data||[]}if(s.error)throw s.error;settings=s.data||{};if(isAdmin()){let [u,au]=await Promise.all([sb.functions.invoke('gfp-admin-users',{body:{action:'list'}}),sb.from('gfp_audit_log').select('*').order('created_at',{ascending:false}).limit(100)]);if(u.error)throw u.error;if(u.data?.error)throw new Error(u.data.error);data.users=u.data?.users||[];if(au.error)throw au.error;data.audit=au.data||[]}}
async function boot(){let {data:s}=await sb.auth.getSession();session=s.session;if(!session){loginView();return}let {data:p,error}=await sb.from('gfp_profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(error||!p||!p.active){await sb.auth.signOut();session=null;loginView('Ce compte n’a pas de profil GFP actif. Contactez un administrateur.');return}profile=p;try{await loadData();render()}catch(e){root.innerHTML='<div class="loginwrap"><div class="login"><div class="brand"><div class="mark">G</div><b>Gestion Foncière Pro</b></div><h1>Chargement impossible</h1><div class="notice error">'+esc(e.message||'Erreur de lecture du registre')+'</div><button class="btn primary" id="retry">Réessayer</button></div></div>';document.getElementById('retry').onclick=boot}}
sb.auth.onAuthStateChange((_event,s)=>{if(s&&!session){setTimeout(boot,0)}else if(!s&&session){session=null;profile=null;loginView()}});boot();
})();
</script></body></html>
